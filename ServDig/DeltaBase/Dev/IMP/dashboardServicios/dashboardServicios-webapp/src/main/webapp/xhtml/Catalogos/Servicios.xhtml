<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" 
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:p="http://primefaces.org/ui">

<ui:composition template="/xhtml/templeates/layoutMenu.xhtml">
	<ui:define name="content">
	    <h:form id="formServicio">
	    	<!-- PANEL DE FILTRO DE BUSQUEDA -->
			<p:fieldset id="filtroBusqueda" legend="Filtro de búsqueda">
				<h:panelGrid columns="2">
				<h:outputLabel for="lstApp" value="Sistemas:" title="Sistemas" />
				<p:selectOneMenu id="lstApp"
						value="#{servicioMB.servicioDTO.cveSistema}" effect="fade">
						<f:selectItem itemLabel="Seleccione" itemValue="" />
						<f:selectItems
							value="#{servicioMB.servicioDTO.lstAplicaciones}" var="app"
							itemLabel="#{app.cveSistema} - #{app.desSistema}"
							itemValue="#{app.cveSistema}" />
					</p:selectOneMenu>
				</h:panelGrid>
			</p:fieldset>
			<div style="text-align: right">
				<p:commandButton value="Buscar" process="@this, filtroBusqueda"
					actionListener="#{servicioMB.buscarServicio}"
					update="resultadoServicio" />
			</div>
			<br></br>

			<!-- PANEL DE TABLA DE RESULTADOS -->
			<p:outputPanel id="resultadoServicio">
					<p:fieldset legend="Resultados" id="resultados" rendered="#{servicioMB.muestraResultado}">
						<p:dataTable var="serivcioTbl"
							value="#{servicioMB.servicioDTO.lstServicios}"
							sortBy="#{serivcioTbl.cveSistema}" paginator="true"
							emptyMessage="No se ha localizado información con los filtros proporcionados"
							rows="25"
							paginatorTemplate="{CurrentPageReport}  {FirstPageLink} {PreviousPageLink} {PageLinks} {NextPageLink} {LastPageLink} {RowsPerPageDropdown}"
							rowsPerPageTemplate="25,50,100">
							<p:column sortBy="#{serivcioTbl.cveSistema}">
								<f:facet name="header">
									<br></br>Clave del servico
				            </f:facet>
							#{serivcioTbl.cveServicio}
			 			</p:column>
							<p:column>
								<f:facet name="header">  
			                 	Descripción corta
				            </f:facet>
								#{serivcioTbl.desServicio}
			 				</p:column>
							<p:column headerText="Editar">
								<p:commandButton icon="ui-icon-pencil" iconPos="center"
									update=":formServicio:editaServico" oncomplete="editarServicio.show()">
									<f:setPropertyActionListener value="#{serivcioTbl}"
										target="#{servico.seleccionaEditaServico}" />
								</p:commandButton>
							</p:column>
							<p:column headerText="Eliminar">
								<p:commandButton icon="ui-icon-trash" iconPos="center"
									oncomplete="confirmaEliminar.show()">
									<f:setPropertyActionListener
										target="#{sistema.seleccionaEliminaServicio}"
										value="#{serivcioTbl}" />
								</p:commandButton>
							</p:column>
						</p:dataTable>
					</p:fieldset>
				<div style="text-align: right">
					<p:commandButton id="btnAgregar" value="Agregar"
						rendered="#{servicio.muestraResultado}" type="button"
						onclick="dlg.show()" />
				</div>
			</p:outputPanel>

			<!-- VENTANA DE DIALOGO PARA AGREGAR UN NUEVO SISTEMA -->
			<p:dialog header="Agregar servicio" widgetVar="dlg"
				position="center" modal="true" showEffect="fade" hideEffect="fade">
				<p:fieldset legend="Datos del servico">
					<h:panelGrid columns="3" id="agregaSis">
						<h:outputLabel for="idSis" value="Clave del sistema:" />
						<p:inputText id="idSis"
							value="#{sistema.sistemaDTO.sistemaTemp.cveSistema}"
							required="true"
							requiredMessage="Se nececista insertar una clave de sistema" />
						<p:message id="errorIdSis" for="idSis" />
						<h:outputLabel for="descSis"
							value="Descripcion corta del sistema:" />
						<p:inputText id="descSis"
							value="#{sistema.sistemaDTO.sistemaTemp.desSistema}"
							required="true"
							requiredMessage="Se nececista insertar una descripcion de sistema" />
						<p:message id="errorDescSis" for="descSis" />
						<h:outputLabel for="descLargaSis"
							value="Descripcion larga del sistema:" />
						<p:editor id="descLargaSis" 
							value="#{sistema.sistemaDTO.sistemaTemp.notaSistema}" width="300" />
					</h:panelGrid>
				</p:fieldset>
				<div style="text-align: right">
					<p:commandButton id="agregarBtn" value="Aceptar"
						update="growl,res,scroll,filtroBusqueda"
						actionListener="#{sistema.agregaSistema}"
						oncomplete="handleValidaCamposRequest(xhr, status, args, dlg)" />
					<p:spacer width="30px" />
					<p:commandButton id="cancelarBtn" value="Cancelar" type="button"
						onclick="dlg.hide()" />
				</div>
			</p:dialog>
			-<!-- VENTANA DE DIALOGO PARA EDICION -->
			<p:dialog modal="true" widgetVar="editarSistema">
				<p:fieldset id="editaSistema" legend="Editar sistema">
				</p:fieldset>
			</p:dialog>
			-<!-- VENTANA DE DIALOGO PARA ELIMINAR -->
			<p:confirmDialog message="¿Realmente desea eleminar este sistema?"
				severity="alert" header="Confirmación" widgetVar="confirmaEliminar">
				<p:commandButton id="btnConfirmaEliminar" process="@this" value="Si"
					actionListener="#{sistema.eliminaSistema}"
					update="growl,res,scroll,filtroBusqueda"
					oncomplete="confirmaEliminar.hide()" />
				<p:spacer width="30px" />
				<p:commandButton id="btnCancelaEliminar" value="No" type="button"
					onclick="confirmaEliminar.hide()" />
			</p:confirmDialog>
	    </h:form>
	</ui:define>
</ui:composition>
</html>
