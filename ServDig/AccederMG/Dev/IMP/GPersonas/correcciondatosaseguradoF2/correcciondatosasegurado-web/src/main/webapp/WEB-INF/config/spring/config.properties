pie.pagina=<tr><td align='justify' style='padding: 15px 0px; text-align: justify;' class='note'><p style='color: #5A5A5A; font-weight: normal; margin: 0px; padding: 0px; font-style: italic; line-height: 20px; font-size: 12px; font-family: Helvetica, Arial;'>Esta direcci&oacute;n de correo electr&oacute;nico no puede recibir respuestas</p></td></tr><tr><td align='justify' style='padding: 15px 0px; text-align: justify;' class='note'><p style='color: #5A5A5A; font-weight: normal; margin: 0px; padding: 0px; font-style: italic; line-height: 20px; font-size: 12px; font-family: Helvetica, Arial;'><strong>AVISO DE PRIVACIDAD: </strong>Los datos personales recabados ser&aacute;n protegidos, tratados e incorporados en el sistema de datos personales denominado Cat&aacute;logo Nacional de Asegurados (CANASE) con fundamento en el Art&iacute;culo: 22 de la Ley del Seguro Social, 3, 97, 113 y 117 de la Ley Federal de Transparencia y Acceso a la Informaci&oacute;n P&uacute;blica, cuya finalidad es proteger, contener, ordenar y clasificar los datos de los patrones y asegurados, El Cat&aacute;logo Nacional de Asegurados (CANASE) est&aacute; registrado en el Listado de Sistemas de Datos Personales ante el Instituto Nacional de Transparencia, Acceso a la Informaci&oacute;n y Protecci&oacute;n de Datos Personales (www.inai.org.mx), y ser&aacute;n transmitidos, al INFONAVIT y a la CONSAR con la finalidad de que el asegurado haga valer su derecho de ejercicio de cr&eacute;dito de vivienda y disposici&oacute;n del Seguro de Retiro, adem&aacute;s de otras prestaciones previstas en la Ley. La Unidad Administrativa responsable del Sistema de Datos Personales es la Direcci&oacute;n de Incorporaci&oacute;n y Recaudaci&oacute;n del Seguro Social en coordinaci&oacute;n con la Direcci&oacute;n de Innovaci&oacute;n y Desarrollo Tecnol&oacute;gico del IMSS y la direcci&oacute;n donde el interesado podr&aacute; ejercer los derechos de acceso y correcci&oacute;n ante la misma es la Subdelegaci&oacute;n de control que corresponde al domicilio del patr&oacute;n o del asegurado, en su caso. Lo anterior se informa en cumplimiento del decimos&eacute;ptimo de los Lineamientos de Protecci&oacute;n de Datos Personales, publicados en el Diario Oficial de la Federaci&oacute;n el 30 de septiembre de 2005.<br /><br /><strong>AVISO IMPORTANTE: </strong>Este correo electr&oacute;nico y/o el material adjunto es para uso exclusivo de la persona o la entidad a la que expresamente se le ha enviado, el cual contiene informaci&oacute;n confidencial. Si no es el destinatario leg&iacute;timo del mismo, por favor rep&oacute;rtelo inmediatamente a la cuenta del remitente y elim&iacute;nelo. Cualquier revisi&oacute;n, almacenamiento, retransmisi&oacute;n, difusi&oacute;n o cualquier otro uso de este correo, por personas o entidades distintas a las del destinatario leg&iacute;timo, queda expresamente prohibida. Este correo electr&oacute;nico no pretende ni debe ser considerado como constitutivo de ninguna relaci&oacute;n legal, contractual o de otra &iacute;ndole similar.</p></td></tr></table></td></tr></table><table cellpadding='0' cellspacing='0' border='0' align='center' width='560px' style='font-family: Helvetica, Arial; font-size: 16px; color: #ffffff; background: #393C3E' class='mainFooter'><tr><td align='left' height='76px' valign='middle' style='padding-left: 27px;'><img width='63' height='19' alt='gob.mx' src='http://serviciosdigitales.imss.gob.mx/delta/resources/imagenes/gobmx/logos/gobmxlogo.png' /></td><td height='76px' valign='middle' align='right' style='padding-right: 27px;'><img width='86' height='35' alt='gob.mx' src='http://serviciosdigitales.imss.gob.mx/delta/resources/imagenes/gobmx/logos/logo_mexico1.png' /></td></tr></table><table cellpadding='0' cellspacing='0' border='0' align='center' width='560px' style='font-family: Helvetica, Arial; line-height: 10px;' bgcolor='#F3F3F3' class='footer'><tr><td bgcolor='#F3F3F3' align='center' style='padding: 15px 0 10px; font-size: 13px; color: #5A5A5A; margin: 0px; line-height: 1.2; font-family: Helvetica, Arial;' valign='top'><p style='padding: 0px; font-size: 13px; color: #5A5A5A; margin: 0px; font-family: Helvetica, Arial; text-transform: uppercase; color: #5A5A5A;'>IMSS, M&eacute;xico - Algunos derechos reservados 2015</p><p style='padding: 0px; font-size: 13px; color: #5A5A5A; margin: 0px 0px 8px 0px; font-family: Helvetica, Arial; text-transform: uppercase; color: #5A5A5A;'><a href='http://www.imss.gob.mx/pages/privacidad.aspx' style='color: #12c;'>POL&Iacute;TICA DE PRIVACIDAD Y MANEJO DE DATOS PERSONALES</a> - <a target='_parent' href='http://www.imss.gob.mx/Pages/avisolegal.aspx' style='color: #12c;'>Aviso LEGAL</a></p></td></tr></table></td></tr></table></body></html>

