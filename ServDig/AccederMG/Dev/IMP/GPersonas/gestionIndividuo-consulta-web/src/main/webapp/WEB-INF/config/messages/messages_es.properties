label.portal.informacion.descripcion = <br />Dentro del m\u00F3dulo de <b>Gesti\u00F3n de Personas</b>, podr\u00E1s realizar tr\u00E1mites de registro de personas bajo 2 modalidades\:<br /><br /><b>&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;-Personas F\u00EDsicas<br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;-Personas Morales</b><br /><br />Los datos de las personas a registrar, ser\u00E1n validados ya sea por alguna entidad externa (<b>SAT, RENAPO</b>), o mediante la entrega de documentaci\u00F3n oficial (que acredite la identidad de la persona) al personal de ventanilla.<br /><br />Seleccione la opci\u00F3n de su preferencia en el men\u00FA <b>REGISTRO DE PERSONAS</b> ubicado del lado derecho
