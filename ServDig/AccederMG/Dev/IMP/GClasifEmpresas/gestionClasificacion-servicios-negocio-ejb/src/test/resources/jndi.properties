log4j.rootLogger           = warn,C
log4j.category.OpenEJB         = trace,C
log4j.category.OpenEJB.server      = trace,C
log4j.category.OpenEJB.startup     = trace,C
log4j.category.OpenEJB.startup.service = trace,C
log4j.category.OpenEJB.startup.config = trace,C
log4j.category.OpenEJB.hsql    = trace,C
log4j.category.CORBA-Adapter       = trace,C
log4j.category.Transaction     = trace,C
log4j.category.org.apache.activemq = trace,C
log4j.category.org.apache.geronimo = trace,C
log4j.category.openjpa         = trace,C
log4j.category.org.hibernate = trace,C


log4j.additivity.OpenEJB         = false
log4j.additivity.OpenEJB.server      = false
log4j.additivity.OpenEJB.startup     = false
log4j.additivity.OpenEJB.startup.service = false
log4j.additivity.OpenEJB.startup.config = false
log4j.additivity.OpenEJB.hsql    = false
log4j.additivity.CORBA-Adapter       = false
log4j.additivity.Transaction     = false
log4j.additivity.org.apache.activemq = false
log4j.additivity.org.apache.geronimo = false
log4j.additivity.openjpa         = false
log4j.additivity.org.hibernate=false

log4j.appender.C           = org.apache.log4j.ConsoleAppender
log4j.appender.C.layout        = org.apache.log4j.PatternLayout
log4j.appender.C.layout.ConversionPattern = %p [%d{dd-MM-yy HH:mm:ss}] %c %m%n

