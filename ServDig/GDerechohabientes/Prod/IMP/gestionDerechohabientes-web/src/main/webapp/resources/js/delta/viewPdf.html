<html>
<head>
<meta http-equiv="pragma" content="no-cache" />
<meta http-equiv="cache-control" content="max-age=0, must-revalidate" />
<title>Vista Previa Documentos</title>
<script type="text/javascript">
  function showDialogArgs(){
  	var direccion=window.dialogArguments;
 	document.getElementById('mydiv').innerHTML ="<embed type='application/pdf' src='"+ direccion +"' width='100%' height='100%' >"
  }
  </script>
</head>
<body onload="return showDialogArgs();">
<div id="mydiv"></div>

</body>
</html>
