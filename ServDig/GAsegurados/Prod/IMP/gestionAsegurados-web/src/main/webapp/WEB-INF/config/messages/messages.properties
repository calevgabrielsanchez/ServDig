registro.asegurado.titulo = Bienvenido
registro.asegurado.descripcion = <br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;En esta p\u00E1gina, podr\u00E1s llenar tu solicitud y obtener un folio para concluir el tr\u00E1mite en la Subdelegaci\u00F3n del IMSS de tu preferencia y tramitar tu <b>N\u00FAmero de Seguridad Social</b>. Deber\u00E1s llenar la solicitud con datos fidedignos, ya que con ello obtendr\u00E1s servicios oportunos y evitar\u00E1s futuras aclaraciones.<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;El n\u00FAmero que obtengas es \u00FAnico, permanente e intransferible.<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;Para un mejor llenado de la solicitud, debes tener a la mano los siguientes documentos\:<br /><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;a) <b>Acta de Nacimiento</b> de la persona a la que se le va a asignar el N\u00FAmero de Seguridad Social<br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;b) <b>CURP</b><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;c) <b>Identificaci\u00F3n Oficial</b> (Credencial para votar expedida por el Instituto Federal Electoral, Pasaporte vigente Mexicano o Extranjero, Cartilla del Servicio Militar Nacional, C\u00E9dula Profesional 
