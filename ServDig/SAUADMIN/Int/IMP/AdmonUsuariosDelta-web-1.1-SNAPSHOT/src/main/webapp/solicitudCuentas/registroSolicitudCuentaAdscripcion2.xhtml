
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ace="http://www.icefaces.org/icefaces/components"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core">


<div>
	<div class="contenedor">
		<div class="row">
		<h:form id="formaRegistroSolicitudCuentaAds">
			<fieldset style="margin: 0; padding: 10px; font-size: 10px;">
			<ace:panel>
				<div>
					<h:panelGrid id="pnRegSolicitudCuentaCrPre" columns="4" width="100%">
						<h:outputLabel value="* CURP:" id="lbCURP" />
						<h:inputText
							value="#{registraSolicitudAdsMB.curp}"
							id="txCurp" size="25" maxlength="18"
							style="text-transform: uppercase" valueChangeListener="#{registraSolicitudAdsMB.lisCurp}"
							partialSubmit="true" immediate="true"/>
						<h:commandButton id="btnValidaRegSolCtaAds" value="Validar RENAPO" styleClass="btn btn-primary btn-sm" onclick="bloquea();">
							<f:ajax listener="#{registraSolicitudAdsMB.validaryCargarDatos2}" render="@all" execute="@all" event="click" immediate="true" />
						</h:commandButton>
							
						<h:outputLabel value="          NOTA: El * implica que el campo es obligatorio" id="lbOBLIGATORIO" style="color: red" />
					</h:panelGrid>
	
					<h:panelGrid id="pnRegSolicitudCuentaCrPre2" columns="9" width="100%">
						<h:outputLabel value="* Nombre:" id="lbNombreRegSolicitudCuenta" />
						<h:inputText
							value="#{registraSolicitudAdsMB.solicitudMB.solicitudDTO.nomNombre}"
							id="txRegSolicitudCuenta" required="true"
							requiredMessage="EL NOMBRE ES REQUERIDO" disabled="true"></h:inputText>
						<h:message for="txRegSolicitudCuenta" errorClass="error" />
	
						<h:outputLabel value="* Apellido Paterno:"
							id="lbApPatRegSolicituCuenta" />
						<h:inputText
							value="#{registraSolicitudAdsMB.solicitudMB.solicitudDTO.nomPaterno}"
							id="txApPatRegSolicitudCuenta" required="true"
							requiredMessage="EL APELLIDO PATERNO ES REQUERIDO"
							disabled="true"></h:inputText>
						<h:message for="txApPatRegSolicitudCuenta" errorClass="error" />
	
						<h:outputLabel value="Apellido Materno:"
							id="lbApMatRegSolicituCuenta" />
						<h:inputText
							value="#{registraSolicitudAdsMB.solicitudMB.solicitudDTO.nomMaterno}"
							id="txApMatRegSolicitudCuenta" required="false"
							requiredMessage="EL APELLIDO MATERNO ES REQUERIDO"
							disabled="true"></h:inputText>
						<h:message for="txApMatRegSolicitudCuenta" errorClass="error" />
					</h:panelGrid>
				</div>
			</ace:panel>
			<br />
            <ace:panel header="Datos de la nómina">
				<h:panelGrid id="pnRegSolicitudCuentaCrPre4" columns="6" width="100%">
					<h:outputLabel value="Matricula:" id="lbMatRegSolicituCuenta" />
					<h:inputText
						value="#{registraSolicitudAdsMB.solicitudMB.solicitudDTO.cveMatricula}"
						id="txMatSolicitudCuenta" disabled="true"></h:inputText>

					<h:outputLabel value="NSS:" id="lbNssRegSolicituCuenta" />
					<h:inputText
						value="#{registraSolicitudAdsMB.solicitudMB.solicitudDTO.nssNom}"
						id="txNssSolicitudCuenta" disabled="true"></h:inputText>

					<h:outputLabel value="Clave delegación:" id="lbDelRegSolicituCuenta" />
					<h:inputText
						value="#{registraSolicitudAdsMB.solicitudMB.solicitudDTO.cveDelegacionNom}"
						id="txDelSolicitudCuenta" disabled="true"></h:inputText>

					<h:outputLabel value="Puesto:" id="lbPuestoRegSolicituCuenta" />
					<h:inputText
						value="#{registraSolicitudAdsMB.solicitudMB.solicitudDTO.puestoDescNom}"
						id="txPuestoSolicitudCuenta" disabled="true"></h:inputText>

					<h:outputLabel value="Departamento:" id="lbDepartamentoRegSolicituCuenta" />
					<h:inputText
						value="#{registraSolicitudAdsMB.solicitudMB.solicitudDTO.departamentoDescNom}"
						id="txDepartamentoSolicitudCuenta" disabled="true"></h:inputText>

					<h:outputLabel value="Estatus:" id="lbStatusRegSolicituCuenta" />
					<h:inputText
						value="#{registraSolicitudAdsMB.solicitudMB.solicitudDTO.estatusNom}"
						id="txStatusSolicitudCuenta" disabled="true"></h:inputText>
				</h:panelGrid>
            </ace:panel>
            <br />
            <ace:panel header="Datos generales de la cuenta de usuario">

					<div>

						<h:panelGrid id="pnRegSolicitudCuentaCrPre3" columns="6" width="100%">

							<h:outputLabel value="Delegación:   " id="lbDelRegSolicitudCuenta" style="padding:10px;"/>
							<h:selectOneMenu id="slDelRegSolicitudCuenta" required="false"
								requiredMessage="SELECCIONE LA DELEGACION"
								disabled="#{consultaGenerica2.fgDeleg}"
								value="#{consultaGenerica2.claveDelegacion}"
								valueChangeListener="#{consultaGenerica2.listenerDelegacion}" style="width:150px" styleClass="form-control">
								<f:selectItem itemValue="#{-99}" itemLabel="Seleccione..." />
								<f:selectItems value="${consultaGenerica2.lstDelegacion}" />
								<f:ajax event="change" render="slDelRegSolicitudCuenta" />
							</h:selectOneMenu>
							
							<h:outputLabel value="SubDelegación:" id="lbSubRegSolicitudCuenta" />
							<h:selectOneMenu id="slSubRegSolicitudCuenta" required="false"
								requiredMessage="SELECCIONE LA SUBDELEGACION"
								disabled="#{consultaGenerica2.fgSubdele}"
								value="#{consultaGenerica2.claveSubdelegacion}"
								valueChangeListener="#{consultaGenerica2.listenerSubdelegacion}" style="width:150px" styleClass="form-control">
								<f:selectItem itemValue="#{-99}" itemLabel="Seleccione..." />
								<f:selectItems value="${consultaGenerica2.lstSubDelegacion}"/>
								<f:ajax event="change" render="slSubRegSolicitudCuenta" />
							</h:selectOneMenu>
							
							<h:outputLabel value="UMF: " id="lbUMFRegSolicitudCuenta" />
							<h:selectOneMenu id="slUMFRegSolicitudCuenta"
								disabled="#{consultaGenerica2.fgUmf}"
								value="#{consultaGenerica2.claveUMF}"
								valueChangeListener="#{consultaGenerica2.listenerUmf}" style="width:150px" styleClass="form-control">
								<f:selectItem itemValue="#{-99}" itemLabel="Seleccione..." />
								<f:selectItems value="${consultaGenerica2.lstUMF}"/>
								<f:ajax event="change" render="slUMFRegSolicitudCuenta" />
							</h:selectOneMenu>

							<h:outputLabel value="Área Normativa:" id="lbAreaNormRegSolicitudCuenta" />
							<h:selectOneMenu id="slAreaNormRegSolicitudCuenta"
								required="false" requiredMessage="SELECCIONE EL AREA NORMATIVA"
								disabled="#{consultaGenerica2.flag}"
								value="#{consultaGenerica2.claveAreaNormativa}" style="width:150px" styleClass="form-control">
								<f:selectItem itemValue="#{-99}" itemLabel="Seleccione..." />
								<f:selectItems value="${consultaGenerica2.lstAreaNormativa}" />
							</h:selectOneMenu>

							<h:outputLabel value="Departamento:" id="lbDepRegSolicitudCuenta" />
							<h:selectOneMenu id="slDepRegSolicitudCuenta" required="false"
								requiredMessage="SELECCIONE EL DEPARTAMENTO"
								value="#{consultaGenerica2.claveDepartamento}"
								valueChangeListener="#{consultaGenerica2.listenerPuesto}" style="width:150px" styleClass="form-control">
								<f:selectItem itemValue="#{-99}" itemLabel="Seleccione..." />
								<f:selectItems value="${consultaGenerica2.lstDepartamento}" />
								<f:ajax event="change" render="slPuestoRegSolicitudCuenta" />	
							</h:selectOneMenu>

							<h:outputLabel value="Puesto:" id="lbPuestoRegSolicitudCuenta" />
							<h:selectOneMenu id="slPuestoRegSolicitudCuenta" required="false"
								requiredMessage="SELECCIONE EL PUESTO"
								value="#{consultaGenerica2.clavePuesto}"
								valueChangeListener="#{consultaGenerica2.listenerPuestoSel}" style="width:150px" styleClass="form-control">
								<f:selectItem itemValue="#{-99}" itemLabel="Seleccione..." />
								<f:selectItems value="${consultaGenerica2.lstPuesto}" />
								<f:ajax event="change" render="slPuestoRegSolicitudCuenta" />
							</h:selectOneMenu>
						</h:panelGrid>
				</div>
				<div>

						<h:panelGrid id="pnRegSolicitudCuentaCrPre7" columns="5" width="100%">
							<h:outputLabel value="Tel. Oficina / Extensión:" id="lbTelOficinaRegSolicituCuenta" style="padding:10px;"/>
							<h:inputText
								value="#{registraSolicitudAdsMB.telefono}"
								id="txTelOficinaSolicitudCuenta" maxlength="19"
								disabled="#{registraSolicitudAdsMB.flagFirstSlide}" 
								valueChangeListener="#{registraSolicitudAdsMB.lisTelefono}"
								partialSubmit="true" immediate="true"></h:inputText>
							<h:outputLabel value="* Correo Electrónico:" id="lbMailRegSolicituCuenta" />
							<h:inputText
								value="#{registraSolicitudAdsMB.correo}"
								id="txMailRegSolicitudCuenta" maxlength="49"
								disabled="#{registraSolicitudAdsMB.flagFirstSlide}" 
								valueChangeListener="#{registraSolicitudAdsMB.lisCorreo}"
								partialSubmit="true" immediate="true"></h:inputText>							
							<h:outputLabel value="@imss.gob.mx" id="lbComplemetoCorreo" />
						</h:panelGrid>
					</div>
					<div class="wp-caption-text">
						<h:panelGrid id="pnRegSolicitudCuentaS2" columns="1" width="100%"  style="text-align:center;">
							<h:commandButton id="bRegistra"	onclick="bloquea();" value="Registrar cuenta de usuario"
								styleClass="btn btn-primary btn-sm" disabled="#{registraSolicitudAdsMB.botonAdd}">
								<f:ajax listener="#{registraSolicitudAdsMB.registrarSolicitudCuenta}" render="@all" execute="@all" event="click" immediate="true" />
							</h:commandButton>

						</h:panelGrid>
					</div>
				</ace:panel>

			<br />


			<ace:panel header="Agregar Grupos a la Cuenta">
				<div>
					<h:panelGrid id="pnRegSolicitudCuentaCrPre5" columns="6">
						<h:outputLabel value="Área Normativa:"
							id="lbAreaNormRegSolicitudCuentaC1" />
						<h:graphicImage value="../imagenes/blanco1.png"
							style="width: 143px; " />
						<h:outputLabel value="Departamento:"
							id="lbDepRegSolicitudCuentaC1" />
						<h:graphicImage value="../imagenes/blanco1.png"
							style="width: 158px; " />
						<h:outputLabel value="Grupo:" id="lbPuestoRegSolicitudCuentaC1" />
						<h:graphicImage value="../imagenes/blanco1.png" />
					</h:panelGrid>

					<h:panelGrid id="pnRegSolicitudCuentaCtrl1" columns="6">
						<h:selectOneMenu id="slAreaNormRegSolicitudCuenta2"
							required="false" requiredMessage="SELECCIONE EL AREA NORMATIVA"
							disabled="#{consultaGenerica2.flag}"
							value="#{consultaGenerica2.claveAreaNormativa}" style="width:150px" styleClass="form-control">
							<f:selectItem itemValue="#{-99}" itemLabel="Seleccione..." />
							<f:selectItems value="${consultaGenerica2.lstAreaNormativa}" />
						</h:selectOneMenu>

						<h:graphicImage value="../imagenes/blanco1.png"
							style="width: 25px; " />

						<h:selectOneMenu id="slDepRegSolicitudCuenta2" required="false"
							requiredMessage="SELECCIONE EL DEPARTAMENTO"
							disabled="#{consultaGenerica2.flag}"
							value="#{consultaGenerica2.claveDepartamentoRolAdd}"
							valueChangeListener="#{consultaGenerica2.listenerPuestoAdd}" style="width:150px" styleClass="form-control">
							<f:selectItems value="${consultaGenerica2.lstDepartamentoRol}" />
							<f:ajax event="change" render="slPuestoRegSolicitudCuentaC1" />
						</h:selectOneMenu>

						<h:graphicImage value="../imagenes/blanco1.png"
							style="width: 25px; " />

						<h:selectOneMenu id="slPuestoRegSolicitudCuentaC1" required="true"
							requiredMessage="SELECCIONE EL GRUPO"
							value="#{consultaGenerica2.claveRolAdd}"
							disabled="#{registraSolicitudAdsMB.modifcarCombos}"
							valueChangeListener="#{consultaGenerica2.listenerRol}" style="width:150px" styleClass="form-control">
							<f:selectItem itemValue="#{-99}" itemLabel="Seleccione..." />
							<f:selectItems value="${consultaGenerica2.lstPuestoAdd}" />
							<f:ajax event="change" render="slPuestoRegSolicitudCuentaC1" />
						</h:selectOneMenu>

						<h:graphicImage value="../imagenes/blanco1.png"
							style="width: 25px; " />
					</h:panelGrid>
				</div>

				<style type="text/css">
				/* Important required because row */
				.ui-datatable-odd {
					background-color: lightgray !important;
					background-position-y: -1400px; /* IE7 hack */
				}
				</style>

				<ace:dataTable
					value="${registraSolicitudAdsMB.solicitudMB.solicitudDTO.puestosDTO}"
					var="rol" id="roles" selectionMode="single"
					stateMap="${registraSolicitudAdsMB.stateMapFromTableOne}"
					rowSelectListener="#{registraSolicitudAdsMB.handleSelectUsuarioFromTableOne}">
					<ace:ajax event="select"
						render="@this selectForm:datosFromTableOne" execute="@this" />

					<ace:column>
						<f:facet name="header">
	                        Default
	                    </f:facet>
	                    ${rol.defaultRol}
	                </ace:column>
					<ace:column>
						<f:facet name="header">
	                        Área
	                    </f:facet>
	                    ${rol.nombreArea}
	                </ace:column>
					<ace:column>
						<f:facet name="header">
	                        Departamento
	                    </f:facet>
	                    ${rol.nombreDepartamento}
	                </ace:column>
					<ace:column>
						<f:facet name="header">
	                        Grupos
	                    </f:facet>
	                    ${rol.nombrePuesto}
	                </ace:column>

				</ace:dataTable>
				<div class="wp-caption-text">
					<h:panelGrid id="botonesGrupo" columns="2" width="100%">
						<h:panelGrid id="botonesGrupoAdd" columns="1" width="100%"  style="text-align:center;">
							<h:commandLink action="${registraSolicitudAdsMB.agregaaTablaUnoPrevio}"
								onclick="return confirm('¿Deseas agregar el grupo seleccionado?')" render="resultErrorRoles">
								<h:graphicImage value="../imagenes/agregarareas.png" alt="Agrega roles"></h:graphicImage>
							</h:commandLink>
							<h:outputLabel value="Agregar Grupo" id="addGrupo" style="margin: 0; padding: 10px; font-size: 8px;"/>
						</h:panelGrid>
						<h:panelGrid id="botonesGrupoDel" columns="1" width="100%"  style="text-align:center;">
							<h:commandLink action="${registraSolicitudAdsMB.eliminaDeTablaUno}"
								onclick="return confirm('¿Deseas eliminar el grupo seleccionado?')" render="resultErrorRoles">
								<h:graphicImage value="../imagenes/eliminarroles.png"></h:graphicImage>
							</h:commandLink>
							<h:outputLabel value="Eliminar Grupo" id="delGrupo" style="margin: 0; padding: 10px; font-size: 8px;"/>
						</h:panelGrid>
					</h:panelGrid>
				</div>
			</ace:panel>

			<br />

			<ace:panel header="Agregar Módulos a la Cuenta">
				<div>
					<h:panelGrid id="pnRegSolicitudCuentaCrPre6" columns="6">
						<h:outputLabel value="Área Normativa:"
							id="lbAreaNormRegSolicitudCuentaC2" />
						<h:graphicImage value="../imagenes/blanco1.png"
							style="width: 141px; " />
						<h:outputLabel value="Departamento:"
							id="lbDepRegSolicitudCuentaC2" />
						<h:graphicImage value="../imagenes/blanco1.png"
							style="width: 162px; " />
						<h:outputLabel value="Módulo:" id="lbModRegSolicitudCuentaC2" />
						<h:graphicImage value="../imagenes/blanco1.png" />
					</h:panelGrid>

					<h:panelGrid id="pnRegSolicitudCuentaCtrl2" columns="6">

						<h:selectOneMenu id="slAreaNormRegSolicitudCuenta3"
							required="false" requiredMessage="SELECCIONE EL AREA NORMATIVA"
							disabled="#{consultaGenerica2.flag}"
							value="#{consultaGenerica2.claveAreaNormativa}" style="width:150px" styleClass="form-control">
							<f:selectItem itemValue="#{-99}" itemLabel="Seleccione..." />
							<f:selectItems value="${consultaGenerica2.lstAreaNormativa}" />
						</h:selectOneMenu>

						<h:graphicImage value="../imagenes/blanco1.png"
							style="width: 25px; " />

						<h:selectOneMenu id="slDepRegSolicitudCuenta3" required="false"
							requiredMessage="SELECCIONE EL DEPARTAMENTO"
							disabled="#{consultaGenerica2.flag}"
							value="#{consultaGenerica2.claveDepartamentoModAdd}"
							valueChangeListener="#{consultaGenerica2.listenerModuloAdd}" style="width:150px" styleClass="form-control">
							<f:selectItems value="${consultaGenerica2.lstDepartamentoMod}" />
							<f:ajax event="change" render="slModRegSolicitudCuentaC2" />
						</h:selectOneMenu>

						<h:graphicImage value="../imagenes/blanco1.png"
							style="width: 25px; " />

						<h:selectOneMenu id="slModRegSolicitudCuentaC2" required="true"
							requiredMessage="SELECCIONE EL MODULO"
							disabled="#{registraSolicitudAdsMB.modifcarCombos}"
							value="#{consultaGenerica2.claveModulo}"
							valueChangeListener="#{consultaGenerica2.listenerMod}" style="width:150px" styleClass="form-control">
							<f:selectItem itemValue="#{-99}" itemLabel="Seleccione..." />
							<f:selectItems value="${consultaGenerica2.lstModuloAdd}" />
							<f:ajax event="change" render="slModRegSolicitudCuentaC2" />
						</h:selectOneMenu>

						<h:graphicImage value="../imagenes/blanco1.png"
							style="width: 25px; " />

					</h:panelGrid>
				</div>
				<ace:dataTable
					value="${registraSolicitudAdsMB.solicitudMB.solicitudDTO.modulosDTO}"
					var="modulo" id="modulos" selectionMode="single"
					stateMap="${registraSolicitudAdsMB.stateMapFromTableTwo}"
					rowSelectListener="#{registraSolicitudAdsMB.handleSelectUsuarioFromTableTwo}">
					<ace:ajax event="select"
						render="@this selectForm:datosFromTableOne" execute="@this" />

					<ace:column>
						<f:facet name="header">
	                        Área
	                    </f:facet>
	                    ${modulo.areaNormDTO.desAreanorma}
	                </ace:column>
					<ace:column>
						<f:facet name="header">
	                        Departamento
	                    </f:facet>
	                    ${modulo.dptoDTO.desDepartamento}
	                </ace:column>
					<ace:column>
						<f:facet name="header">
	                        Módulos
	                    </f:facet>
	                    ${modulo.desModulo}
	                </ace:column>

				</ace:dataTable>
				<br />

				<div class="wp-caption-text">
				
					<h:panelGrid id="btnModsRegSolCtaAds" columns="2" width="100%">
						<h:panelGrid id="botonesModuloAdd" columns="1" width="100%"  style="text-align:center;">
							<h:commandLink action="${registraSolicitudAdsMB.agregaaTablaDos}"
								onclick="return confirm('¿Deseas agregar el módulo seleccionado?')"
								render="resultErrorModulos">
								<h:graphicImage value="../imagenes/agregarroles.png"></h:graphicImage>
							</h:commandLink>
							<h:outputLabel value="Agregar Módulo" id="addModulo" style="margin: 0; padding: 10px; font-size: 8px;"/>
						</h:panelGrid>
						<h:panelGrid id="botonesModuloDel" columns="1" width="100%"  style="text-align:center;">
							<h:commandLink action="${registraSolicitudAdsMB.eliminaDeTablaDos}"
								onclick="return confirm('¿Deseas eliminar el módulo seleccionado?')">
								<h:graphicImage value="../imagenes/eliminarareas.png"></h:graphicImage>
							</h:commandLink>
							<h:outputLabel value="Eliminar Módulo" id="delModulo" style="margin: 0; padding: 10px; font-size: 8px;"/>
						</h:panelGrid>
					</h:panelGrid>
				</div>
			</ace:panel>
			</fieldset>
		</h:form>
		</div>
	</div>
</div>
</html>
