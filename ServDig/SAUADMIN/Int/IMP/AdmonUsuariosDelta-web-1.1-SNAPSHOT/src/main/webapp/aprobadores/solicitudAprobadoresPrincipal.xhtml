<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ace="http://www.icefaces.org/icefaces/components"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<h:form id="formSol">
			<ace:dataTable id="solExtByModuloRow" style="font-size:9px"
                          value="#{solicitudPrincipalMB.lista}"
                          var="solicitud"
                          rows="10"
	                      paginator="true"
                          paginatorPosition="top">
                
                <ace:column id="curp" headerText="CURP">
                    <h:outputText id="curpCell" value=" #{solicitud.desUsrCurp}"/>
                </ace:column>
                <ace:column id="nombre" headerText="Nombre">
                    <h:outputText id="nombreCell" value=" #{solicitud.nombreCompleto}"/>
                </ace:column>
                 <ace:column id="estatus" headerText="Estatus">
                    <h:outputText id="estatusCell" value="#{solicitud.estatusDTO.desEstatus}"/>
                </ace:column>
                <ace:column id="perfiles" headerText="No. Grupos">
                    <h:outputText id="perfilesCell" value="#{solicitud.numPerfiles}"/>
                </ace:column>
                 <ace:column id="modulos" headerText="No. Módulos" >
                    <h:outputText id="modulosCell" value="#{solicitud.numModulos}"/>
                </ace:column>
                <ace:column id="area" headerText="Área Normativa">
                    <h:outputText id="areaCell" value="#{solicitud.areaNorm.desAreanorma}"/>
                </ace:column>
                <ace:column id="del" headerText="Delegación">
                    <h:outputText id="delCell" value="#{solicitud.delDTO.nombreDelegacion}"/>
                </ace:column>
                <ace:column id="sub" headerText="Subdelegación">
                    <h:outputText id="subCell" value="#{solicitud.subdelDTO.nombreSubelegacion}"/>
                </ace:column>
                <ace:column id="dep" headerText="Departamento">
                    <h:outputText id="depCell" value="#{solicitud.dptoDTO.desDepartamento}"/>
                </ace:column>
                <ace:column id="puesto" headerText="Puesto">
                    <h:outputText id="puestoCell" value="#{solicitud.puestoDTO.nombrePuesto}"/>
                </ace:column>
 
                <ace:column id="accion" headerText="Acciones" style="width:220px;margin:1px;" >
					 <ace:menuBar id="acciones" autoSubmenuDisplay="false">
                 		<ace:submenu id="file" label="Acción" styleClass="btn btn-primary btn-sm">
	                 		<ace:menuItem id="b1" value="Borrar cuenta" rendered="#{solicitud.estatus == 2}" actionListener="#{solicitudPrincipalMB.borraCuenta}">
	                 			<f:attribute name="cuenta" value="#{solicitud.desUsrCurp}"/>
	                 			<f:ajax execute="@this" render="@this"/>
	                 		</ace:menuItem>
	                 		<ace:menuItem id="b2" value="Borrar cuenta cambio CURP" rendered="#{solicitud.estatus == 2}" actionListener="#{solicitudPrincipalMB.borraCuentaCurp}">
	                 			<f:attribute name="cuenta" value="#{solicitud.desUsrCurp}"/>
	                 			<ace:ajax execute="@this" render="@this" event="activate" />
	                 		</ace:menuItem>
	                 		<ace:menuItem id="a" value="Autorizar cuenta" rendered="#{solicitud.estatus == 1}" actionListener="#{solicitudPrincipalMB.actualizarCuenta}">
	                 			<f:attribute name="cuenta" value="#{solicitud.desUsrCurp}"/>
	                 			<ace:ajax execute="@this" render="@this" event="activate" />
	                 		</ace:menuItem>
	                 		<ace:menuItem id="m" value="Modificar cuenta" rendered="#{solicitud.estatus == 2}" actionListener="#{solicitudPrincipalMB.modificarCuenta}">
	                 			<f:attribute name="cuenta" value="#{solicitud.desUsrCurp}"/>
	                 			<f:ajax event="activate" render="detalleMod" />
	                 		</ace:menuItem>
	                 		<ace:menuItem id="r" value="Recuperar cuenta" rendered="#{solicitud.estatus == 4 or solicitud.estatus == 6}" actionListener="#{solicitudPrincipalMB.recuperarCuenta}">
	                 			<f:attribute name="cuenta" value="#{solicitud.desUsrCurp}"/>
	                 			<ace:ajax execute="@this" render="@this" event="activate" />
	                 		</ace:menuItem>
                 		</ace:submenu>
                 	</ace:menuBar>
                </ace:column>

            </ace:dataTable>
	</h:form>
</ui:composition>
