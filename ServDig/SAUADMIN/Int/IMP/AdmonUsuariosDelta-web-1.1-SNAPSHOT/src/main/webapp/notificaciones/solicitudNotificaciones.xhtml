<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<ui:composition xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ace="http://www.icefaces.org/icefaces/components"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

	<h:form id="formSol">
		<f:metadata>
			<f:event type="preRenderView" listener="#{notificarSolicitudMB.inicializaParametros}"/>
		</f:metadata>
			<ace:dataTable id="notifRow" style="font-size:9px"
                          value="#{notificarSolicitudMB.lista}"
                          var="notificacion"
                          rows="10"
	                      paginator="true"
                          paginatorPosition="top"
                          selectionMode="single"
                          rowSelectListener="#{notificarSolicitudMB.selectListenerDetalle}"
                          >
                <ace:ajax event="select" execute="@all" render="@all" onComplete="sampleDialog.show();"/>

                <ace:column id="curp" headerText="CURP">
                    <h:outputText id="curpCell" value=" #{notificacion.solicitud.desUsrCurp}"/>
                </ace:column>
                <ace:column id="nombre" headerText="Nombre">
                    <h:outputText id="nombreCell" value=" #{notificacion.solicitud.nombreCompleto}"/>
                </ace:column>
                 <ace:column id="estatus" headerText="Estatus">
                    <h:outputText id="estatusCell" value="#{notificacion.solicitud.estatusDTO.desEstatus}"/>
                </ace:column>
                <ace:column id="area" headerText="Área Normativa">
                    <h:outputText id="areaCell" value="#{notificacion.solicitud.areaNorm.desAreanorma}"/>
                </ace:column>
                <ace:column id="del" headerText="Delegación">
                    <h:outputText id="delCell" value="#{notificacion.solicitud.delDTO.nombreDelegacion}"/>
                </ace:column>
                <ace:column id="sub" headerText="Subdelegación">
                    <h:outputText id="subCell" value="#{notificacion.solicitud.subdelDTO.nombreSubelegacion}"/>
                </ace:column>
                <ace:column id="dep" headerText="Departamento">
                    <h:outputText id="depCell" value="#{notificacion.solicitud.dptoDTO.desDepartamento}"/>
                </ace:column>
                <ace:column id="puesto" headerText="Puesto">
                    <h:outputText id="puestoCell" value="#{notificacion.solicitud.puestoDTO.nombrePuesto}"/>
                </ace:column>
                <ace:column id="vigencia" headerText="Vigencia Notif." >
                    <h:outputText id="vigeCell" value="#{notificacion.estatusN}"/>
                </ace:column>
            </ace:dataTable>
			<ace:panel id="detalles" >
			<ace:dialog id="dialog"
                               widgetVar="sampleDialog"
                               modal="true"
                               draggable="false"
                               showEffect="clip"
                               hideEffect="fade"
                               width="800" header="Detalles Notificación" resizable="false">
						<div class="wp-caption-text">
							<h:panelGrid width="100%" columns="2" id="detalle">
		                        <h:outputLabel id="curpLabel" for="curptxt" value="CURP:"/>
		                        <h:outputText id="curptxt" value="#{notificarSolicitudMB.activaCuentaSelect.solicitud.desUsrCurp}" />
		
								<h:outputLabel id="matriLabel" for="matritxt" value="Matrícula:"/>
		                        <h:outputText id="matritxt" value="#{notificarSolicitudMB.activaCuentaSelect.solicitud.cveMatricula}" />
		
								<h:outputLabel id="nombreLabel" for="nombretxt" value="Nombre:"/>
		                        <h:outputText id="nombretxt" value="#{notificarSolicitudMB.activaCuentaSelect.solicitud.nombreCompleto}" />
		
								<h:outputLabel id="correoLabel" for="correotxt" value="Correo:"/>
		                        <h:outputText id="correotxt" value="#{notificarSolicitudMB.activaCuentaSelect.solicitud.refCorreoElectronico}" />
		                        
		                        <h:outputLabel id="telLabel" for="teltxt" value="Teléfono:"/>
		                        <h:outputText id="teltxt" value="#{notificarSolicitudMB.activaCuentaSelect.solicitud.desTelefonoOfi}" />
		                        
								<h:outputLabel id="fecLabel" for="fectxt" value="Fecha de registro de notificación:"/>
		                        <h:outputText id="fectxt" value="#{notificarSolicitudMB.activaCuentaSelect.fechaRegistro}" >
			                   		<f:convertDateTime pattern="dd/MM/yyyy" for="fectxt"/>
	        		           	</h:outputText>

								<h:outputLabel id="fecvigLabel" for="cal" value="Fecha de vigencia:"/>

					              <ace:dateTimeEntry id="cal" value="#{notificarSolicitudMB.fechaVigencia}" pattern="dd/MM/yyyy" popupIcon="../imagenes/cal1.png" showOn="button"
					                    renderAsPopup="true" mindate="#{notificarSolicitudMB.hoy}" popupIconOnly="true">
					                    <ace:ajax event="dateSelect"
					                                     listener="#{notificarSolicitudMB.dateSelectListener}"
					                                     render="cal"/>
					                    <ace:ajax event="dateTextChange"
					                        listener="#{notificarSolicitudMB.dateTextChangeListener}" render="cal"/>
					                </ace:dateTimeEntry>                                         
					            <h:outputLabel id="space" value=" "/>      
	                    	</h:panelGrid>
						</div>

				 <h:panelGrid width="100%" columns="2" id="botonesGrales" style="text-align:center">
					<h:commandButton value="Aplicar cambios a notificación" onclick="bloquea();">
						<f:ajax listener="#{notificarSolicitudMB.aplicaCambiosCuenta}" render="@all" execute="@all" event="click" immediate="true"/>
					</h:commandButton>
					<h:commandButton value="Reenviar notificación" onclick="bloquea();">
							<f:ajax listener="#{notificarSolicitudMB.reenviarNotificacion}" render="@all" execute="@all" event="click" immediate="true"/>
					</h:commandButton>
				</h:panelGrid>
            </ace:dialog>
	</ace:panel>
	</h:form>
	
</ui:composition>
