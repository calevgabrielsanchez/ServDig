<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ace="http://www.icefaces.org/icefaces/components"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

<ui:composition template="../plantillas/plantilla.xhtml">
	<ui:define name="body">
		<h:form id="form">

				<ace:linkButton value="Consultar  por Solicitud" 
					actionListener="#{solicitudMB.obtenerSolByFiltro}" />

			<ace:linkButton value="Consultar por Modulo"
			actionListener="#{solicitudMB.obtenerSolExtByDepto}">
				<f:attribute name="idDepto" value="3"/>		
				
			</ace:linkButton>
			
			
			<ace:dataTable id="solExtByModuloRow"
                          value="#{solicitudMB.lista}"
                          var="solicitud"
                          rows="10"
                          selectionMode="single"
                          rowSelectListener="#{solicitudMB.selectListenerDeptosExt}"
                          >
                <ace:ajax event="select" execute="@all" render="@all" onComplete="sampleDialog.show();" onSuccess=""/>
                
              	
                <ace:column id="nombre" headerText="Nombre">
                    <h:outputText id="nombreCell" value=" #{solicitud.nombreCompleto}"/>
                </ace:column>
                 <ace:column id="estatus" headerText="Estatus">
                    <h:outputText id="estatusCell" value="#{solicitud.estatusDTO.desEstatus}"/>
                </ace:column>
                <ace:column id="perfiles" headerText="No. Perfiles">
                    <h:outputText id="perfilesCell" value="#{solicitud.numPerfiles}"/>
                </ace:column>
                 <ace:column id="modulos" headerText="No. Modulos">
                    <h:outputText id="modulosCell" value="#{solicitud.numModulos}"/>
                </ace:column>
                <ace:column id="area" headerText="Area Normativa">
                    <h:outputText id="areaCell" value="#{solicitud.areaNorm.desAreanorma}"/>
                </ace:column>
                <ace:column id="del" headerText="Delegacion">
                    <h:outputText id="delCell" value="#{solicitud.delDTO.nombreDelegacion}"/>
                </ace:column>
                <ace:column id="sub" headerText="Subdelegacion">
                    <h:outputText id="subCell" value="#{solicitud.subdelDTO.nombreSubelegacion}"/>
                </ace:column>
                <ace:column id="dep" headerText="Departamento">
                    <h:outputText id="depCell" value="#{solicitud.dptoDTO.desDepartamento}"/>
                </ace:column>
                <ace:column id="puesto" headerText="Puesto">
                    <h:outputText id="puestoCell" value="#{solicitud.puestoDTO.nombrePuesto}"/>
                </ace:column>
                <ace:column id="fechaSol" headerText="Fecha de solicitud">
                    <h:outputText id="fechaSolCell" value="#{solicitud.fecRegistroAlta}"/>
                </ace:column>
            </ace:dataTable>

			<ace:panel id="detalleModulos" >
			<ace:dialog id="dialog"
                               widgetVar="sampleDialog"
                               modal="true"
                               draggable="false"
                               showEffect="clip"
                               hideEffect="fade"
                               width="500"
                               >

						<h:panelGrid width="100%" columns="2" id="detalle">
	                        <h:outputLabel id="curpLabel" for="curptxt" value="CURP:"/>
	                        <h:outputText id="curptxt" value="#{solicitudMB.solicitudExtPorModulo.desUsrCurp}" />
	
							<h:outputLabel id="matriLabel" for="matritxt" value="Matrícula:"/>
	                        <h:outputText id="matritxt" value="#{solicitudMB.solicitudExtPorModulo.cveMatricula}" />
	
							<h:outputLabel id="nombreLabel" for="nombretxt" value="Nombre:"/>
	                        <h:outputText id="nombretxt" value="#{solicitudMB.solicitudExtPorModulo.nombreCompleto}" />
	
							<h:outputLabel id="correoLabel" for="correotxt" value="Correo:"/>
	                        <h:outputText id="correotxt" value="#{solicitudMB.solicitudExtPorModulo.refCorreoElectronico}" />
	                        
	                        <h:outputLabel id="telLabel" for="teltxt" value="Telefono:"/>
	                        <h:outputText id="teltxt" value="#{solicitudMB.solicitudExtPorModulo.desTelefonoOfi}" />
	
							<h:outputLabel id="deptoLabel" for="deptotxt" value="Departamento:"/>
	                        <h:outputText id="deptotxt" value="#{solicitudMB.solicitudExtPorModulo.dptoDTO.desDepartamento}" />
	
							<h:outputLabel id="ptoLabel" for="ptotxt" value="Puesto:"/>
	                        <h:outputText id="ptotxt" value="#{solicitudMB.solicitudExtPorModulo.puestoDTO.nombrePuesto}" />
	
							<h:outputLabel id="delLabel" for="deltxt" value="Delegacion:"/>
	                        <h:outputText id="deltxt" value="#{solicitudMB.solicitudExtPorModulo.delDTO.nombreDelegacion}" />
	                        
                    	</h:panelGrid>
                    	
				<ace:tabSet id="idTabs" >
               		<ace:tabPane id="solicitud" label="Perfiles asociados">
               			
               			<ace:dataTable id="perfilesRow"
	                          value="#{solicitudMB.solicitudExtPorModulo.perfilesDTO}"
	                          var="perfil"
	                          rows="10"
	                          >
	                         
							<h:panelGrid width="100%" columns="4" id="perfilesDetalle">
								<ace:column id="chbPerfil" headerText="">
				                	<ace:checkboxButton id="chb#{perfil.cveSsoperfilessol}" value="0"/>
				                </ace:column>
				                <ace:column id="descAreaP" headerText="Area">
				                	<h:outputLabel id="txdescAreaP#{perfil.cveSsoperfilessol}" value="#{perfil.areaNormDTO.desAreaNorma}"/>
								</ace:column>
								<ace:column id="descDeptoP" headerText="Departamento">
				                	<h:outputLabel id="txdescDeptoP#{perfil.cveSsoperfilessol}" value="#{perfil.deptoDTO.desDepartamento}"/>
								</ace:column>
				                <ace:column id="descPerfil" headerText="Puesto">
				                	<h:outputLabel id="txdescPerfil#{perfil.cveSsoperfilessol}" value="#{perfil.puestoDTO.nombrePuesto}"/>
								</ace:column>
							</h:panelGrid>
	                   	</ace:dataTable>
	                   	
               		</ace:tabPane>
               		<ace:tabPane id="modulos" label="Modulos asociados">
	               		
	               		<ace:dataTable id="modulosRow"
	                          value="#{solicitudMB.solicitudExtPorModulo.modulosDTO}"
	                          var="modulo"
	                          rows="10"
	                         >
<!-- 	                         <h:panelGrid width="100%" columns="4" id="perfilesDetalle"> -->
	                         
	                         <ace:column id="chbModul#{modulo.cveIdModulo}" headerText="S">
				                	<ace:checkboxButton id="chb#{modulo.cveIdModulo}" value="0"/>
				                </ace:column>
				                <ace:column id="descAreaM" headerText="Area">
				                	<h:outputLabel id="txdescAreaM#{modulo.cveIdModulo}" value="#{modulo.areaNormDTO.desAreaNorma}"/>
								</ace:column>
								<ace:column id="descDeptoM" headerText="Departamento">
				                	<h:outputLabel id="txdescDeptoM#{modulo.cveIdModulo}" value="#{modulo.dptoDTO.desDepartamento}"/>
								</ace:column>
								<ace:column id="descModulo" headerText="Modulo">
				                	<h:outputLabel id="txdescModulo#{modulo.cveIdModulo}" value="#{modulo.desModulo}"/>
								</ace:column>
								
<!-- 				             </h:panelGrid> -->
	                   	</ace:dataTable>
					</ace:tabPane>
               		
				</ace:tabSet>
				
            </ace:dialog>
	</ace:panel>
		</h:form>
	</ui:define>
</ui:composition>
</html>
