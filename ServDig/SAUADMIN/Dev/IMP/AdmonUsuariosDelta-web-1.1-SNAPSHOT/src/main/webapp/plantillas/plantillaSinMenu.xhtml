<h:head>

<link type="text/css" href="http://serviciosdigitales.imss.gob.mx/delta/resources/estilos/bootstrap/bootstrap.min.css" rel="stylesheet" />
<!-- IMSS -->
<link type="text/css" href="http://serviciosdigitales.imss.gob.mx/delta/resources/estilos/imss/reset.css" rel="stylesheet" />
<link type="text/css" href="http://serviciosdigitales.imss.gob.mx/delta/resources/estilos/imss/style.css" rel="stylesheet" /> 
<link href="../css/bar.css" rel="stylesheet" type="text/css"/>

<script type="text/javascript" src="/delta/resources/js/org/cometd.js"></script>

<script type="text/javascript" src="/delta/resources/js/jquery/comet/jquery.cometd-ack.js"></script>

<script type="text/javascript" src="/delta/resources/js/jquery/comet/jquery.cometd-timestamp.js"></script>
<script type="text/javascript" src="/delta/resources/js/jquery/comet/jquery.cometd-timesync.js"></script>

<link type="text/css" href="/delta/resources/estilos/imss/portal.css" rel="stylesheet" /> 

<script>

$(document).ready(function(){
	setInterval(Error,10000);
  }); 

</script>


<script language="javascript">
function setFocus(){
    document.getElementById("correoElectronico").focus();
    return true;
}

function Error(){
	//document.getElementById('general:hiddenBtn').onclick() 
}

function refresh(){
	document.getElementById('SolicitudesPrincipal:hiddenBtnRefrresh').onclick() 
}

function desbloquear(){
	wait.hide();
}

function bloquea(){
	wait.show();
}

function baja(){
	
	if(confirm('¿Deseas dar de baja definitiva el usuario?'))
	{
		bloquea();
		return true;
	}
	else
	{
		return false;	
	}
}

function bajaCurp(){
	if(confirm('¿Deseas dar de baja por cambio de CURP?'))
	{
		bloquea();
		return true;
	}
	else
	{
		return false;	
	}
}

function recupera(){
	window.open ("#{request.contextPath}/admonUsuarios/recuperacionCredenciales2.xhtml","mywindow","menubar=0,resizable=0,width=800,height=250,location=0,toolbar=0");
}


</script>

 
 
<script type="text/javascript">
   jsf.ajax.addOnError(function(data) {
 if (data.responseText.indexOf("SessionExpiredException") > 0) {
	 document.location.href = "../admonUsuarios/logout.xhtml";
        }
   });
</script>

</h:head>

<h:body>
<!-- 
 <div id="dialogEndOfSession" style="display: none" title="Sesion terminada por inactividad">
		    <span>Su sesion se ha desactivado debido a inactividad en el portal</span>
		</div>
 -->
	<div class="site_position_center_fixed" style="width: 1070px; margin:0 auto;">
		<div>
			
		    <ui:insert name="encabezado">
		    	<ui:include src="encabezadoUser.xhtml"/>
		    </ui:insert>
			<h:form id="general">
				<h:commandButton value="+" id="hiddenBtn" style="display:none">
					<f:ajax  listener="#{login.validaSession}" render="@all" execute="@all" event="click" immediate="true"/>
				</h:commandButton>
			</h:form>	

        <ace:dialog id="wait"
                           header="Mensaje del sistema"
                           widgetVar="wait"
                           closable="false"
                           modal="true"
                           draggable="false"
                           showEffect="clip"
                           hideEffect="fade"
                           width="300"
                           visible="false"
                           resizable="false">
            
            <h:form id="inputFormWait">
                <h:panelGrid columns="1" width="100%">
                    <h:outputLabel id="lbWait" value="Su petición se está procesando... Espere un momento"/>
                </h:panelGrid>
            </h:form>
            
        </ace:dialog>					
			
        <ace:dialog id="mensaje"
                           header="Alerta"
                           widgetVar="mensaje"
                           closable="false"
                           modal="true"
                           draggable="false"
                           showEffect="clip"
                           hideEffect="fade"
                           width="400"
                           visible="#{consultaGenerica.msg}"
                           onShow="desbloquear();"
                           resizable="false">
            
            <h:form id="inputForm">
                <h:panelGrid columns="2" width="100%">
                    <h:outputLabel id="labelMsg" value="#{consultaGenerica.desc}"/>
                </h:panelGrid>

                <h:panelGrid width="100%" style="text-align: center;">
                    <!-- <h:commandButton id="submit" value="Aceptar" onclick="sampleDialog.hide();desbloquear();" actionListener="#{consultaGenerica.hide}" /> -->
                    
                    <h:commandButton value="Aceptar" id="btnSuccess" onclick="desbloquear();mensaje.hide();refresh();" styleClass="btn btn-primary btn-sm">
                    	<f:ajax  listener="#{consultaGenerica.hide}" execute="inputForm" render="@all" />
					</h:commandButton>
                    
                </h:panelGrid>
            </h:form>
            
        </ace:dialog>			
			
        <ace:dialog id="mensajeAds"
                           header="Alerta"
                           widgetVar="mensajeAds"
                           closable="false"
                           modal="true"
                           draggable="false"
                           showEffect="clip"
                           hideEffect="fade"
                           width="400"
                           visible="#{consultaGenerica2.msg}"
                           onShow="desbloquear();"
                           resizable="false">
            
            <h:form id="inputFormAds">
                <h:panelGrid columns="2" width="100%">
                    <h:outputLabel id="labelMsgAds" value="#{consultaGenerica2.desc}"/>
                </h:panelGrid>

                <h:panelGrid width="100%" style="text-align: center;">
                    <!-- <h:commandButton id="submit" value="Aceptar" onclick="sampleDialog.hide();desbloquear();" actionListener="#{consultaGenerica.hide}" /> -->
                    
                    <h:commandButton value="Aceptar" id="btnSuccessAds" onclick="desbloquear();mensajeAds.hide();refresh();" styleClass="btn btn-primary btn-sm">
                    	<f:ajax  listener="#{consultaGenerica2.hide}" execute="inputFormAds" render="@all" />
					</h:commandButton>
                    
                </h:panelGrid>
            </h:form>
            
        </ace:dialog>			

        <ace:dialog id="mensajeAdmon"
                           header="Alerta"
                           widgetVar="mensajeAdmon"
                           closable="false"
                           modal="true"
                           draggable="false"
                           showEffect="clip"
                           hideEffect="fade"
                           width="400"
                           visible="#{consultaGenericaAdmon.msg}"
                           onShow="desbloquear();"
                           resizable="false">
            
            <h:form id="inputFormAdmon">
                <h:panelGrid columns="2" width="100%">
                    <h:outputLabel id="labelMsgAdmon" value="#{consultaGenericaAdmon.desc}"/>
                </h:panelGrid>

                <h:panelGrid width="100%" style="text-align: center;">
                    
                    <h:commandButton value="Aceptar" id="btnSuccessAdmon" onclick="desbloquear();mensajeAdmon.hide();refresh();" styleClass="btn btn-primary btn-sm">
                    	<f:ajax  listener="#{consultaGenericaAdmon.hide}" execute="inputFormAdmon" render="@all" />
					</h:commandButton>
                    
                </h:panelGrid>
            </h:form>
            
        </ace:dialog>			

        <ace:dialog id="mensajeDeleg"
                           header="Alerta"
                           widgetVar="mensajeDeleg"
                           closable="false"
                           modal="true"
                           draggable="false"
                           showEffect="clip"
                           hideEffect="fade"
                           width="400"
                           visible="#{consultaGenericaDeleg.msg}"
                           onShow="desbloquear();"
                           resizable="false">
            
            <h:form id="inputFormDeleg">
                <h:panelGrid columns="2" width="100%">
                    <h:outputLabel id="labelMsgAdmon" value="#{consultaGenericaDeleg.desc}"/>
                </h:panelGrid>

                <h:panelGrid width="100%" style="text-align: center;">
                    
                    <h:commandButton value="Aceptar" id="btnSuccessDeleg" onclick="desbloquear();mensajeDeleg.hide();refresh();" styleClass="btn btn-primary btn-sm">
                    	<f:ajax  listener="#{consultaGenericaDeleg.hide}" execute="inputFormDeleg" render="@all" />
					</h:commandButton>
                    
                </h:panelGrid>
            </h:form>
            
        </ace:dialog>			

        <ace:dialog id="mensajeError"
                           header="Alerta"
                           widgetVar="mensajeAdmon"
                           closable="false"
                           modal="true"
                           draggable="false"
                           showEffect="clip"
                           hideEffect="fade"
                           width="400"
                           visible="false"
                           onShow="desbloquear();"
                           resizable="false">
            
            <h:form id="inputFormError">
                <h:panelGrid columns="2" width="100%">
                    <h:outputLabel id="labelMsgAdmon" value="Error de comunicación favor de intentarlo nuevamente"/>
                </h:panelGrid>

                <h:panelGrid width="100%" style="text-align: center;">
                    
                    <h:commandButton value="Aceptar" id="btnSuccessError" onclick="desbloquear();mensajeError.hide();" styleClass="btn btn-primary btn-sm">
					</h:commandButton>
                    
                </h:panelGrid>
            </h:form>
        </ace:dialog>			
	
        <ace:dialog id="mensajeRenovacion"
                           header="Alerta"
                           widgetVar="mensajeRen"
                           closable="false"
                           modal="true"
                           draggable="false"
                           showEffect="clip"
                           hideEffect="fade"
                           width="400"
                           visible="#{login.renovacion}"
                           onShow="desbloquear();"
                           resizable="false">
            
            <h:form id="inputFormRen">
                <h:panelGrid columns="2" width="100%">
                    <h:outputLabel id="labelMsgRen" value="¿La session esta por vencer desea renovarla?"/>
                </h:panelGrid>

                <h:panelGrid width="100%" style="text-align: center;" columns="2">
                    <h:commandButton value="Si" id="btnSuccessRenYes" onclick="desbloquear();" styleClass="btn btn-primary btn-sm">
                    	<f:ajax  listener="#{login.renovarSession}" execute="inputFormRen" render="@all" />
					</h:commandButton>
                    <h:commandButton value="No" id="btnCancelRenNo" onclick="desbloquear();" styleClass="btn btn-primary btn-sm">
                    	<f:ajax  listener="#{login.logoutSistema}" execute="inputFormRen" render="@all" />
					</h:commandButton>
                </h:panelGrid>
            </h:form>
        </ace:dialog>			

        <ace:dialog id="mensajeSession"
                           header="Alerta"
                           widgetVar="mensajeSes"
                           closable="false"
                           modal="true"
                           draggable="false"
                           showEffect="clip"
                           hideEffect="fade"
                           width="400"
                           visible="#{login.finSession}"
                           onShow="desbloquear();"
                           resizable="false">
            
            <h:form id="inputFormSes">
                <h:panelGrid columns="2" width="100%">
                    <h:outputLabel id="labelMsgRen" value="La session ha vecido es necesario volver a autentificarse!"/>
                </h:panelGrid>

                <h:panelGrid width="100%" style="text-align: center;" columns="2">
                    <h:commandButton value="Aceptar" id="btnCancelSes" onclick="desbloquear();" styleClass="btn btn-primary btn-sm">
                    	<f:ajax  listener="#{login.logoutSistema}" execute="inputFormSes" render="@all" />
					</h:commandButton>
                </h:panelGrid>
            </h:form>
        </ace:dialog>			


        <ace:dialog id="mensajeBaja"
                           header="Alerta"
                           widgetVar="baja"
                           closable="false"
                           modal="true"
                           draggable="false"
                           showEffect="clip"
                           hideEffect="fade"
                           width="400"
                           onShow="desbloquear();"
                           resizable="false">
            
            <h:form id="inputFormBaja">
                <h:panelGrid columns="2" width="100%">
                    <h:outputLabel id="labelMsgBaja" value="¿Esta seguro de dar de baja la cuenta de usuario?"/>
                </h:panelGrid>

                <h:panelGrid width="100%" style="text-align: center;" columns="2">
                    <h:commandButton value="Aceptar" id="btnAceptaBaja" onclick="bloquea();baja.hide();" styleClass="btn btn-primary btn-sm">
                    	<f:ajax  listener="#{solicitudPrincipalMB.bajaDeUsuario}" execute="inputFormBaja" render="@all" />
					</h:commandButton>
                    <h:commandButton value="Cancelar" id="btnCancelBaja" onclick="desbloquear();baja.hide();" styleClass="btn btn-primary btn-sm">
					</h:commandButton>
                </h:panelGrid>
            </h:form>
        </ace:dialog>			

        <ace:dialog id="mensajeBajaCurp"
                           header="Alerta"
                           widgetVar="bajaCurp"
                           closable="false"
                           modal="true"
                           draggable="false"
                           showEffect="clip"
                           hideEffect="fade"
                           width="400"
                           onShow="desbloquear();"
                           resizable="false">
            
            <h:form id="inputFormBajaCurp">
                <h:panelGrid columns="2" width="100%">
                    <h:outputLabel id="labelMsgBajaCurp" value="¿Esta seguro de dar de baja la cuenta de usuario?"/>
                </h:panelGrid>

                <h:panelGrid width="100%" style="text-align: center;" columns="2">
                    <h:commandButton value="Aceptar" id="btnAceptaBajaCurp" onclick="bloquea();bajaCurp.hide();" styleClass="btn btn-primary btn-sm">
                    	<f:ajax  listener="#{solicitudPrincipalMB.bajaDeUsuarioCambioCurp}" execute="inputFormBajaCurp" render="@all" />
					</h:commandButton>
                    <h:commandButton value="Cancelar" id="btnCancelBajaCurp" onclick="desbloquear();bajaCurp.hide();" styleClass="btn btn-primary btn-sm">
					</h:commandButton>
                </h:panelGrid>
            </h:form>
        </ace:dialog>			
			    				
			<div>
				<div class="contenedor">
					<div class="row">
						<ui:insert name="body" />
					</div>
				</div>
			</div>
			
			<ui:insert name="footer">
				<ui:include src="pie.xhtml"/>
			</ui:insert>						
		</div>
</div>
</h:body>
</html>
