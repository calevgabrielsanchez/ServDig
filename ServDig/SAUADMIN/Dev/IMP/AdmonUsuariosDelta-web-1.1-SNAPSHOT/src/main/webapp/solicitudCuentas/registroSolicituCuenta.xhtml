<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:h="http://java.sun.com/jsf/html"
      xmlns:f="http://java.sun.com/jsf/core"
      xmlns:ui="http://java.sun.com/jsf/facelets"
      xmlns:c ="http://java.sun.com/jsp/jstl/core">

	<ui:composition template="../plantillas/plantilla.xhtml">
		<ui:define name="body">
			<h3>Registro de Solicitud de Cuenta Interna</h3>			
			<h:form>
				<fieldset style="border: 1px solid silver; margin: 0; padding: 15px;">
					<h:panelGrid id="pnRegSolicitudCuenta" columns="3">
					
					<h:outputLabel value="Nombre :" id="lbNombreRegSolicitudCuenta"/>
					<h:inputText value="#{solicitudCuentaBean.usuarioSolicitud.nombres}" id="txRegSolicitudCuenta" required="true" requiredMessage="EL NOMBRE ES REQUERIDO" maxlength="20"/>
					<h:message for="txRegSolicitudCuenta" errorClass="error"/>
					
					<h:outputLabel value="Apellido Paterno :" id="lbApPatRegSolicituCuenta"/>
					<h:inputText value="#{solicitudCuentaBean.usuarioSolicitud.apellidoPaterno}" id="txApPatRegSolicitudCuenta" required="true" requiredMessage="EL APELLIDO PATERNO ES REQUERIDO" maxlength="15"/>
					<h:message for="txApPatRegSolicitudCuenta" errorClass="error"/>
					
					<h:outputLabel value="Apellido Materno :" id="lbApMatRegSolicituCuenta"/>
					<h:inputText value="#{solicitudCuentaBean.usuarioSolicitud.apellidoMaterno}" id="txApMatRegSolicitudCuenta" required="true" requiredMessage="EL APELLIDO MATERNO ES REQUERIDO" maxlength="15"/>
					<h:message for="txApMatRegSolicitudCuenta" errorClass="error"/>					
								
					<h:outputLabel value="Correol Electronico :" id="lbMailRegSolicituCuenta"/>
					<h:inputText value="#{solicitudCuentaBean.usuarioSolicitud.correoElectronico}" id="correoElectronico" size="30">				
						<f:validator validatorId="validaMail" />
					</h:inputText>
					<h:message for="correoElectronico" errorClass="error"/>
										
					<h:outputLabel value="CURP :" id="lbCURP"/>	
                    <h:inputText value="${solicitudCuentaBean.usuarioSolicitud.curp}" id="txCurp" maxlength="18"  style="text-transform: uppercase">
                    	<f:validator validatorId="validaCURP" />
                    </h:inputText>
					<h:message for="txCurp" errorClass="error"/>
																																
					<h:outputLabel value="Matricula :" id="lbMatRegSolicituCuenta"/>
					<h:inputText value="#{solicitudCuentaBean.usuarioSolicitud.matricula}" id="txMatSolicitudCuenta" maxlength="12">
						<f:validator validatorId="validaMatricula" />
					</h:inputText>
					<h:message for="txMatSolicitudCuenta" errorClass="error"/>					
															
					<h:outputLabel value="Delegación :" id="lbDelRegSolicitudCuenta"/>
                	<h:selectOneMenu id="slDelRegSolicitudCuenta" value="#{solicitudCuentaBean.usuarioSolicitud.claveDelegacion}" required="true" valueChangeListener="#{usuarioBean.listenerDelegacion}" requiredMessage="SELECCIONE LA DELEGACION">
						<f:selectItem itemValue="#{-99}" itemLabel="Seleccione..." />
						<f:selectItems value="${usuarioBean.lstDelegacion}" />						
					    <f:ajax event="change" render="slSubRegSolicitudCuenta" />						
					</h:selectOneMenu>
					<h:message for="slDelRegSolicitudCuenta" id="msgDelRegSolicitudCuenta"  errorClass="error"/>
					
					<h:outputLabel value="SubDelegación :" id="lbSubRegSolicitudCuenta"/>				
                	<h:selectOneMenu id="slSubRegSolicitudCuenta" value="#{solicitudCuentaBean.usuarioSolicitud.claveSubDelegacion}" required="true" requiredMessage="SELECCIONE LA SUBDELEGACION">
						<f:selectItem itemValue="#{-99}" itemLabel="Seleccione..." />
						<f:selectItems value="${usuarioBean.lstSubDelegacion}" var="v"
							itemValue="#{v.SubdelegacionTO.cveSubelegacion}"
							itemLabel="#{v.SubdelegacionTO.nombreSubelegacion}" />												
						 	<f:ajax listener="#{solicitudCuentaBean.listenerUnidadMedica}" render="slUMFRegSolicitudCuenta"/>	
					</h:selectOneMenu>
					<h:message for="slSubRegSolicitudCuenta" errorClass="error"/>											
					
					<!--h:outputLabel value="Modulo :" id="lbModuloRegSolicitudCuenta"/>
					<h:selectOneMenu id="slModuloRegSolicitudCuenta" value="#{solicitudCuentaBean.usuarioSolicitud.claveModulo}">
						<f:selectItem itemValue="#{-99}" itemLabel="Seleccione..."></f:selectItem>
						<f:selectItems value="#{solicitudCuentaBean.listaSelectModulo}"></f:selectItems>
						<f:ajax listener ="#{solicitudCuentaBean.listenerUnidadMedica}" render="slUMFRegSolicitudCuenta" />					   	
					</h:selectOneMenu>
					<h:message for="slModuloRegSolicitudCuenta" errorClass="error"></h:message>-->					
					
					 <!-- disabled="#{solicitudCuentaBean.usuarioSolicitud.claveModulo !=4}"  -->
					 <h:outputLabel value="UMF : " id="lbUMFRegSolicitudCuenta"/>									
                	    <h:selectOneMenu id="slUMFRegSolicitudCuenta" value="#{solicitudCuentaBean.usuarioSolicitud.claveUMF}" >
						<f:selectItem itemValue="#{-99}" itemLabel="Seleccione..." />
						<f:selectItems value="${solicitudCuentaBean.lstUMF}" var="v"
							itemValue="${v.UnidadMedicaTO.cveUmf}"
							itemLabel="${v.UnidadMedicaTO.nombreUmf}" />						
					  </h:selectOneMenu>	
					 <h:message for="slUMFRegSolicitudCuenta" errorClass="error"></h:message>											    			    								
																
					<h:outputLabel value="Areas :" id="perfiles"/>
					<h:selectOneMenu id="lsPerfiles" value="#{solicitudCuentaBean.selectPerfil}" >
					<f:selectItem itemValue="#{-99}" itemLabel="Seleccione..." />
 		  				<f:selectItems value="${usuarioBean.lstPerfiles}" />
   					</h:selectOneMenu>							
					<h:message for="lsPerfiles" errorClass="error"/>					
					
					<h:outputLabel value="Grupos :" id="grupos"/>
					<h:selectManyListbox id="lsGrupos" value="#{solicitudCuentaBean.selectGrupos}" >
 		  				<f:selectItem itemLabel="Jefe de Departamento" itemValue="JD" />
  						<f:selectItem itemLabel="Jefe de Oficina" itemValue="JO" />
  						<f:selectItem itemLabel="Operador" itemValue="OP" />
  						<f:selectItem itemLabel="Ventanilla" itemValue="VT" />  				
   					</h:selectManyListbox>
					<h:message for="lsGrupos" errorClass="error"/>		
																				
					<h:outputLabel/>
					<h:inputHidden value="#{solicitudCuentaBean.hiddenSubdelegacion}" id="hiddenId"/>															
					<h:outputLabel/>
					</h:panelGrid>
										
					<h:commandButton value="Registrar" action="#{solicitudCuentaBean.registrarSolicitud}" styleClass="mboton"/>	
				</fieldset>							
			</h:form>
		</ui:define>	
	</ui:composition>	 
</html>
