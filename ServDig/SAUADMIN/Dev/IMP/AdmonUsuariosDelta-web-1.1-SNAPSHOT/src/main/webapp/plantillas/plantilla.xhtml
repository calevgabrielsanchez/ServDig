<script>
var closure_force_logout = function(event, ui) {
	
	document.location.href = '/Sauimssdigital/j_spring_security_logout';
}





$(document).ready(function(){

	setInterval(Error,10000);
	
	CometCtrl.prototype.addSubscriber = function(subscription) {
		this.listInitialSubscription.push(subscription);
	};

	setTimeout(function() {
		
		
		var user = $("#sUidUsurio").val();
		

		var timeout_subscriber = {
			channel : [ '/channels/server/session/', user ].join(''),
			action : function(message) {
				

				if (message.data.session_finished === true) {

					$('#dialogEndOfSession').dialog({
						resizable : false,
						height : 'auto',
						modal : true,
						close : closure_force_logout,
						buttons : {
							"ACEPTAR" : closure_force_logout
						}
					});
				}
			}
		};


		var conector = new CometCtrl();
		conector.addSubscriber(timeout_subscriber);
		conector.init(false);
		

	}, 1100);

  }); 

</script>

<script language="javascript">
function setFocus(){
    document.getElementById("correoElectronico").focus();
    return true;
}

function waiting(){
	setTimeout(Error(), 600000000000);
}

function Error(){
	document.getElementById('general:hiddenBtn').onclick() 
}

function desbloquear(){
	wait.hide();
}

function bloquea(){
	wait.show();
}

function baja(){
	
	if(confirm('¿Deseas dar de baja definitiva el usuario?'))
	{
		bloquea();
		return true;
	}
	else
	{
		return false;	
	}
}

function bajaCurp(){
	if(confirm('¿Deseas dar de baja por cambio de CURP?'))
	{
		bloquea();
		return true;
	}
	else
	{
		return false;	
	}
}


</script>
