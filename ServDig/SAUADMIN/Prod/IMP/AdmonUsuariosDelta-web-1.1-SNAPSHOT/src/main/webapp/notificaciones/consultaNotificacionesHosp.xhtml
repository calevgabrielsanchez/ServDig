<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:f="http://java.sun.com/jsf/core"
	xmlns:h="http://java.sun.com/jsf/html"
	xmlns:ace="http://www.icefaces.org/icefaces/components"
	xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:c="http://java.sun.com/jsp/jstl/core">

<ui:composition template="../plantillas/plantilla.xhtml">
	<ui:define name="body">
        <div id ="titulo" align="center">
  	  		<h3>Notificaciones pendientes de cuenta de usuarios</h3>
	   	</div>
		<h:form>
		<fieldset style="margin: 0; padding: 10px; font-size: 10px;">
			<div align="center" id="general" style="padding: 10px; font-size: 10px;"  class="wp-caption-text">

				<ace:panel header="Datos Generales">

					<h:panelGrid id="pnRegSolicitudCuentaCrPre3" columns="6" width="100%">
					
							<h:outputLabel value="Área Normativa:" id="lbAreaNormRegSolicitudCuenta" />
							<h:selectOneMenu id="slAreaNormRegSolicitudCuenta"
								required="false" requiredMessage="SELECCIONE EL AREA NORMATIVA"
								valueChangeListener="#{consultaGenericaDeleg.listenerArea}"
								value="#{consultaGenericaDeleg.claveAreaNormativa}" style="width:200px"
								disabled="true">
								<f:selectItems value="${consultaGenericaDeleg.lstAreaNormativa}" />
								<f:ajax event="change" render="slDepRegSolicitudCuenta slPuestoRegSolicitudCuenta slDelRegSolicitudCuenta slSubRegSolicitudCuenta slUMFRegSolicitudCuenta" />
							</h:selectOneMenu>

							<h:outputLabel value="Departamento:" id="lbDepRegSolicitudCuenta" />
							<h:selectOneMenu id="slDepRegSolicitudCuenta" required="false"
								requiredMessage="SELECCIONE EL DEPARTAMENTO"
								value="#{consultaGenericaDeleg.claveDepartamento}"
								valueChangeListener="#{consultaGenericaDeleg.listenerPuesto}" style="width:200px">
								<f:selectItem itemValue="#{-99}" itemLabel="Seleccione..." />
								<f:selectItems value="${consultaGenericaDeleg.lstDepartamento}" />
								<f:ajax event="change" render="slPuestoRegSolicitudCuenta" />	
							</h:selectOneMenu>

							<h:outputLabel value="Puesto:" id="lbPuestoRegSolicitudCuenta" />
							<h:selectOneMenu id="slPuestoRegSolicitudCuenta" required="false"
								requiredMessage="SELECCIONE EL PUESTO"
								value="#{consultaGenericaDeleg.clavePuesto}"
								valueChangeListener="#{consultaGenericaDeleg.listenerPuestoSel}" style="width:200px">
								<f:selectItem itemValue="#{-99}" itemLabel="Seleccione..." />
								<f:selectItems value="${consultaGenericaDeleg.lstPuesto}" />
								<f:ajax event="change" render="slPuestoRegSolicitudCuenta" />
							</h:selectOneMenu>

							<h:outputLabel value="Delegación:   " id="lbDelRegSolicitudCuenta" />
							<h:selectOneMenu id="slDelRegSolicitudCuenta" required="false"
								requiredMessage="SELECCIONE LA DELEGACION"
								disabled="#{consultaGenericaDeleg.fgDeleg}"
								value="#{consultaGenericaDeleg.claveDelegacion}"
								valueChangeListener="#{consultaGenericaDeleg.listenerDelegacion}" style="width:200px">
								<f:selectItem itemValue="#{-99}" itemLabel="Seleccione..." />
								<f:selectItems value="${consultaGenericaDeleg.lstDelegacion}" />
								<f:ajax event="change" render="slDelRegSolicitudCuenta slSubRegSolicitudCuenta slUMFRegSolicitudCuenta" />
							</h:selectOneMenu>
							
							<h:outputLabel value="SubDelegación:" id="lbSubRegSolicitudCuenta" />
							<h:selectOneMenu id="slSubRegSolicitudCuenta" required="false"
								requiredMessage="SELECCIONE LA SUBDELEGACION"
								disabled="#{consultaGenericaDeleg.fgSubdele}"
								value="#{consultaGenericaDeleg.claveSubdelegacion}"
								valueChangeListener="#{consultaGenericaDeleg.listenerSubdelegacion}" style="width:200px">
								<f:selectItem itemValue="#{-99}" itemLabel="Seleccione..." />
								<f:selectItems value="${consultaGenericaDeleg.lstSubDelegacion}"/>
								<f:ajax event="change" render="slSubRegSolicitudCuenta slUMFRegSolicitudCuenta" />
							</h:selectOneMenu>
							
							<h:outputLabel value="UMF: " id="lbUMFRegSolicitudCuenta" />
							<h:selectOneMenu id="slUMFRegSolicitudCuenta"
								disabled="#{consultaGenericaDeleg.fgUmf}"
								value="#{consultaGenericaDeleg.claveUMF}"
								valueChangeListener="#{consultaGenericaDeleg.listenerUmf}" style="width:200px">
								<f:selectItem itemValue="#{-99}" itemLabel="Seleccione..." />
								<f:selectItems value="${consultaGenericaDeleg.lstUMF}"/>
								<f:ajax event="change" render="slUMFRegSolicitudCuenta" />
							</h:selectOneMenu>

					</h:panelGrid>

					<h:panelGrid id="pnRegSolicitudCuentaC" columns="1" width="100%">
						<h:message for="slAreaNormRegSolicitudCuenta" id="msgAreaNormRegSolicitudCuenta" errorClass="error" />
						<h:message for="slDepRegSolicitudCuenta" id="msgDepRegSolicitudCuenta" errorClass="error" />
						<h:message for="slPuestoRegSolicitudCuenta" errorClass="error" />
						<h:message for="slDelRegSolicitudCuenta" id="msgDelRegSolicitudCuenta" errorClass="error" />
						<h:message for="slSubRegSolicitudCuenta" errorClass="error" />
						<h:message for="slUMFRegSolicitudCuenta" errorClass="error"></h:message>
					</h:panelGrid>
					
		            <h:panelGrid id="pnRegSolicitudCuentaS" columns="1" width="100%" styleClass="centeredPanelGrid" border="1">
						<h:commandButton value="Consultar notificaciones pendientes">
							<f:ajax listener="#{notificarSolicitudHospMB.obtenerNotificacionesByFiltro}" render="@all" execute="@all" event="click" immediate="true"/>
						</h:commandButton>
					</h:panelGrid>
				</ace:panel>
				
				<BR />
			</div>
				
			<div align="center" id="genera2">					
				<ace:panel header="Resultados">
		            <style type="text/css">
		                /* Important required because row */
		                .ui-datatable-odd {
		                    background-color:lightgray !important;
		                    background-position-y: -1400px; /* IE7 hack */
		                }
		            </style>

				<c:if test="#{sessionScope.pagina eq 2}">
						<ui:include src="solicitudNotificacionesHosp.xhtml"/>
				</c:if>
				</ace:panel>
			
			
			</div>
		</fieldset>
		    
		</h:form>
		
		    	
		    
		
	</ui:define>
</ui:composition>
</html>
