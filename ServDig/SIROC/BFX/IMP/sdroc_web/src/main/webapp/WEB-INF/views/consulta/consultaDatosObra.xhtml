								<td>

					        </td>
					        <td>
					        	<label class="control-label" th:text="#{consulta.obra.dom.num.int}"/>
					        </td>
					        <td>
					        	<label th:if="${resumenRegistrosObra.ubicacionObraDTO.numInterior != null and resumenRegistrosObra.ubicacionObraDTO.numInterior != 'null' and resumenRegistrosObra.ubicacionObraDTO.numInterior != '0'}" class="control-label" style="font-weight: normal !important;" th:text="${resumenRegistrosObra.ubicacionObraDTO.numInterior}" />

					        	<label th:if="${(resumenRegistrosObra.ubicacionObraDTO.numInterior == null or resumenRegistrosObra.ubicacionObraDTO.numInterior == 'null' or resumenRegistrosObra.ubicacionObraDTO.numInterior == '0') and (resumenRegistrosObra.ubicacionObraDTO.numInteriorAlf == null or resumenRegistrosObra.ubicacionObraDTO.numInteriorAlf == 'null' or resumenRegistrosObra.ubicacionObraDTO.numInteriorAlf == '')}" class="control-label" style="font-weight: normal !important;" th:text="SN" />
					        </td>
					        <td>
					        	<label class="control-label" th:text="#{consulta.obra.dom.cp}"/>
					        </td>
					        <td>
					        	<label class="control-label" style="font-weight: normal !important;" th:text="${resumenRegistrosObra.ubicacionObraDTO.codigoPostal}"/>

        					</td>
      					  </tr>
					    </tbody>
		  			</table>

					        </td>

					      <tr>
					        <td>
					        	<label th:if="${resumenRegistrosObra.informacionPatronDTO.tipoPatronDTO.cveTipoPatron != 4}" class="control-label" th:text="#{consulta.obra.monto}" />

					        <td>
					        	<label class="control-label" style="font-weight: normal !important;" th:text="${resumenRegistrosObra.tipoObraDTO.clasificacionObraDTO.desClasificacionObra}"/>
					        </td>
					      </tr>
					      <tr>
					        <td>

					      <tr th:if="${resumenRegistrosObra.tipoObraDTO.clasificacionObraDTO.cveClasificacionObra == 2 and resumenRegistrosObra.informacionPatronDTO.tipoPatronDTO.cveTipoPatron == 2}">

					        <td>
					        	<label class="control-label" style="font-weight: normal !important;" th:text="${resumenRegistrosObra.numProcedimiento}"/>

					        <td></td>

					        <td colspan="4">
					        	<label th:if="${resumenRegistrosObra.informacionPatronDTO.tipoPatronDTO.cveTipoPatron != 4}" class="control-label" th:text="#{consulta.obra.periodo}" />

					        	<label class="control-label" style="font-weight: normal !important;" th:text="${#calendars.format(resumenRegistrosObra.fecIniObra,'dd/MM/yyyy')}" />

					        </td>
					      </tr>
					    </tbody>
					  </table>
				</div>

									</div>
