<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org">
<head th:substituteby="header :: head">
<meta name="tipo_contenido" content="text/html;"
	http-equiv="content-type" charset="utf-8"></meta>
</head>
<body>
	<div class="container">
	<input id="pasoConsulta" value="2" class="hidden"/>
		<div th:substituteby="header :: pageHeader"></div>

		<div id="pnlDatosResumen" class="panel panel-default">
			<div class="panel-heading" >
				<div class="row">
					<div class="col-sm-6 text-left">
						<small th:text="#{escritorio.titulo}" />
					</div>
					<div class="col-sm-6 text-right">	
						<a class="accordion-toggle text-right" data-toggle="collapse"
							data-parent="#accordion" href="#collapseOne"> 
							<img id="imgCollapsable"
								src="/sdroc_web/static/images/panel-collapsed.png"
								style="width: 25px">
							</img>
						</a>
					</div>
				</div>
			</div>
			<div id="collapseOne" class="panel-collapse collapse in">
				<div id="pnlInformation" class="panel-body text-center">
					<div th:substituteby="registro/obra/datosPatron :: pageDatosPatron"></div>
				</div>
			</div>		
			
		</div>

		<div id="pnlConsultaObra" class="panel panel-default small">
			<div class="panel-heading">
				Resultados
			</div>
			<div class="panel-body text-center">
				<div class="scrollable-table">
					<table id="tblRegistrosPatronales"
						class="table table-striped table-responsive">
						<thead>
							<tr>
								<th class="small">No.</th>
								<th class="small">N&uacute;mero de Registro de Obra</th>
								<th class="small">Ubicaci&oacute;n</th>
								<th class="small">Estatus</th>
								<th class="small">Acci&oacute;n</th>
							</tr>
						</thead>
						<tbody class="searchable">
							<tr th:each="ro, status : ${listaRegistrosPatronales}"
								class="text-left">
								<td th:text="${status.count}" class="small" />
								<td class="small"><a
									th:with="var=*{ro.cveRegistroObra}, idreg=*{ro.cveInformacionObra}"
									th:href="@{|/resumenRegistro/${var}/${idreg}|}"
									th:text="${ro.cveRegistroObra}"> </a></td>
								<td class="small" th:utext="${ro.ubicacionObraDTO.calle + ' EXT.'
									+ (ro.ubicacionObraDTO.numExterior != null and ro.ubicacionObraDTO.numExterior != 'null' and ro.ubicacionObraDTO.numExterior != '' ? ' ' + ro.ubicacionObraDTO.numExterior : '')
									+ (ro.ubicacionObraDTO.numExteriorAlf != null and ro.ubicacionObraDTO.numExteriorAlf != 'null' and ro.ubicacionObraDTO.numExteriorAlf != '' ? ' ' + ro.ubicacionObraDTO.numExteriorAlf : (ro.ubicacionObraDTO.numExterior != null and ro.ubicacionObraDTO.numExterior != 'null' and ro.ubicacionObraDTO.numExterior != '' ? '' : ' SN'))
									+ ' INT.' + (ro.ubicacionObraDTO.numInterior != null and ro.ubicacionObraDTO.numInterior != 'null' and ro.ubicacionObraDTO.numInterior != '' and ro.ubicacionObraDTO.numInterior != '0' ? ' ' + ro.ubicacionObraDTO.numInterior : '')
									+ (ro.ubicacionObraDTO.numInteriorAlf != null and ro.ubicacionObraDTO.numInteriorAlf != 'null' and ro.ubicacionObraDTO.numInteriorAlf != '' and ro.ubicacionObraDTO.numInteriorAlf != '0' ? ' ' + ro.ubicacionObraDTO.numInteriorAlf : (ro.ubicacionObraDTO.numInterior != null and ro.ubicacionObraDTO.numInterior != 'null' and ro.ubicacionObraDTO.numInterior != '' and ro.ubicacionObraDTO.numInterior != '0' ? '' : ' SN'))
									+ ', ' + ro.ubicacionObraDTO.refColonia
									+ ', ' + ro.ubicacionObraDTO.refMunicipio 
									+ ', ' + ro.ubicacionObraDTO.refEntidad
									+ ', CP ' + ro.ubicacionObraDTO.codigoPostal}"/>
								
								<td class="small" th:text="${ro.estatusObraDTO.desEstatusObra}" />
								<td class="small">
									<select onchange="mostrarAcusesContrato(this)">
											<option selected="selected">Seleccione ...</option>
											<option th:id="${ro.numSeqNotaria}" th:value="${'/sdroc_web/acuses/'+ro.numSeqNotaria+'/'+ro.cveInformacionObra}">Acuses</option>
											<option th:id="${ro.cveInformacionObra}" value="/sdroc_web/subcontratos/">Subcontratos</option>
									</select>
								</td>
							</tr>
						</tbody>
					</table>
				</div>
			</div>
		</div>
		<div class="row">
			<div class="col-md-12">
			
				<form>
					<button class="btn btn-primary pull-right  btn-sm"
						id="btnExportarExcel" th:with="var=*{regPatronal}"
						th:formaction="@{|/registroPatronal/exportaExcel/${var}|}">Exportar
						resultados</button>
				</form>
				
				<form action="/">
					<button class="btn btn-default pull-right  btn-sm" style="margin-right: 5px;" id="btnRegresarResumenConsulta"
						formaction="/sdroc_web/consulta">Regresar</button>
				</form>
			</div>
		</div>

		<br></br>


		<div id="pnlReporteObrasPorRegPatronal">
			<!-- 			<a th:src="@{/static/report/reporteEjemplo.xlsx}" th:attr="download='archivo.xlsx'" >xxxxx</a> -->

			<!-- 					<iframe   height="100%" width="100%" -->
			<!-- 						style="overflow: hidden"></iframe> -->
		</div>

		<div id="modalVisorAcuses"></div>
		<br></br>
	</div>
</body>
</html>
