#Mensajes Carta de t\u00e9rminos
carta.terminos.titulo=Carta de t&eacute;rminos y condiciones en los actos que se realicen ante el Instituto Mexicano del Seguro Social (IMSS) en el portal ciudadano, mediante el uso de la Clave &Uacute;nica del Registro de Poblaci&oacute;n (CURP) y el Registro Federal de Contribuyentes(RFC).
carta.terminos.parrafo1=Con fundamento en los art&iacute;culos 92 y 94 de la Ley General de Poblaci&oacute;n, 43 y 44 del Reglamento de Ley General de Poblaci&oacute;n, 69-C de la Ley Federal de Procedimiento Administrativo y, el Acuerdo para la adopci&oacute;n y uso por la Administraci&oacute;n P&uacute;blica Federal de la Clave &Uacute;nica de Registro de Poblaci&oacute;n, publicado en el Diario Oficial de la Federaci&oacute;n del 23 de octubre de 1996, 27 del C&oacute;digo Fiscal de la Federaci&oacute;n y 22 del Reglamento del C&oacute;digo Fiscal de la Federaci&oacute;n <strong>las personas f&iacute;sicas podr&aacute;n optar por realizar actos ante el IMSS mediante el Portal Ciudadano de manera electr&oacute;nica, firmando directamente con el uso mancomunado de su Clave &Uacute;nica de Registro de Poblaci&oacute;n (CURP) y Registro Federal de Contribuyentes (RFC)</strong>, que est&eacute;n vigentes y hayan sido emitidos por el Registro Nacional de Poblaci&oacute;n e Identificaci&oacute;n Personal (RENAPO) y el Servicio de Administraci&oacute;n Tributaria (SAT).
carta.terminos.parrafo2=La <strong>CURP</strong> y el <strong>RFC</strong> sustituyen la firma aut&oacute;grafa del firmante y producir&aacute; los mismos efectos que las leyes otorgan a los documentos con firma aut&oacute;grafa, teniendo el mismo valor probatorio. Asimismo, con el uso de la <strong>CURP</strong> y el <strong>RFC</strong> se tiene por reconocida la garant&iacute;a de la autor&iacute;a del firmante y de la integridad de los documentos electr&oacute;nicos que se firmen con ella y, por ende, el contenido de los mismos no podr&aacute; desconocerse, ni admitir&aacute; prueba en contrario.
carta.terminos.parrafo3=La expedici&oacute;n de la <strong>CURP</strong> y el <strong>RFC</strong>, se regir&aacute;n por la <strong>Ley General de Poblaci&oacute;n, el Acuerdo para la adopci&oacute;n y uso por la Administraci&oacute;n P&uacute;blica Federal de la Clave &Uacute;nica de Registro de Poblaci&oacute;n y el C&oacute;digo Fiscal de la Federaci&oacute;n</strong>, su reglamentaci&oacute;n secundaria en la materia, respectivamente.
carta.terminos.parrafo4=Por lo tanto, la expedici&oacute;n de la <strong>CURP</strong> y el <strong>RFC</strong>, su renovaci&oacute;n, revocaci&oacute;n y dem&aacute;s tr&aacute;mites relacionados, se deber&aacute;n realizar ante <strong>RENAPO</strong> y el <strong>SAT</strong>, respectivamente cumpliendo con los requisitos y procedimientos establecidos en la normatividad aplicable.
carta.terminos.parrafo5=Las personas f&iacute;sicas, que opten por identificarse y autenticarse para realizar actos ante el IMSS en el Portal Ciudadano con el uso mancomunado de su <strong>CURP</strong> y <strong>RFC</strong>, reconocen que es de su exclusiva responsabilidad el resguardo de esta informaci&oacute;n y su confidencialidad, con el fin de evitar la utilizaci&oacute;n no autorizada de la misma. Por lo tanto, los actos firmados con la <strong>CURP</strong> y el <strong>RFC</strong>, en el Portal Ciudadano del IMSS se tendr&aacute;n por v&aacute;lidos y sin que se admita prueba en contrario, el v&iacute;nculo entre el firmante, y los datos que fueron utilizados ser&aacute;n imputables al titular que los haya utilizado.
carta.terminos.parrafo6=Los actos firmados ante el IMSS en el Portal Ciudadano con la <strong>CURP</strong> y el <strong>RFC</strong> ser&aacute;n considerados hechos leg&iacute;tima y aut&eacute;nticamente por el firmante. Lo anterior, no admitir&aacute; prueba en contrario ante el IMSS y el titular de la <strong>CURP</strong> y el <strong>RFC</strong> ser&aacute; responsable de las consecuencias jur&iacute;dicas que deriven de los actos que se realicen ante el IMSS, para lo cual firmar&aacute; mancomunadamente, con sus respectivas <strong>CURP</strong> y el <strong>RFC</strong> y en momentos sucesivos inmediatos, el documento electr&oacute;nico que el Instituto ponga a su disposici&oacute;n para tal efecto.
carta.terminos.parrafo7=En caso de p&eacute;rdida o robo de la <strong>CURP</strong> y el <strong>RFC</strong> o cualquier otro evento que ponga en riesgo la confidencialidad del tr&aacute;mite realizado o la utilizaci&oacute;n no autorizada de la <strong>CURP</strong> y el <strong>RFC</strong>, la persona f&iacute;sica, bajo su absoluta responsabilidad, deber&aacute; proceder a denunciarla ante las autoridades competentes, sujet&aacute;ndose a los procesos y lineamientos que las mismas autoridades determinen.
carta.terminos.parrafo8=La falta de vigencia o modificaci&oacute;n de la <strong>CURP</strong> y el <strong>RFC</strong>, no eximir&aacute; a la persona f&iacute;sica de cumplir con sus obligaciones ante el IMSS; por lo cual, ser&aacute; su responsabilidad presentar cualquier promoci&oacute;n o tr&aacute;mite ante el IMSS, de conformidad con la Ley del Seguro Social, sus reglamentos y dem&aacute;s disposiciones aplicables.
carta.terminos.parrafo9=La persona f&iacute;sica manifiestan bajo protesta de decir verdad que, a la fecha del tr&aacute;mite ante el IMSS en el Portal Ciudadano de manera electr&oacute;nica, firm&aacute;ndola directamente con su <strong>Clave &Uacute;nica de Registro de Poblaci&oacute;n (CURP)</strong> y el <strong>Registro Federal de Contribuyentes (RFC)</strong>, no ha realizado actos que contravenga lo estipulado en la Ley del Seguro Social, sus reglamentos y dem&aacute;s normativa aplicable en materia de seguridad social, en caso contrario, proceder&aacute; la cancelaci&oacute;n de cualquier tr&aacute;mite realizado por esa v&iacute;a y se evaluar&aacute; el beneficio otorgado.
carta.terminos.parrafo10=Los t&eacute;rminos y condiciones antes se&ntilde;alados son aplicables a la aceptaci&oacute;n de los mismos que en este acto realice el firmante, mediante su firma mancomunadamente de la <strong>CURP</strong> y el <strong>RFC</strong>.
carta.terminos.parrafo11=En caso de realizar el tr&aacute;mite de Alta Patronal e Inscripci&oacute;n en el Seguro de Riesgos de Trabajo, los patrones personas f&iacute;sicas que se ubiquen en los supuestos del art&iacute;culo noveno del Decreto por el que se otorgan est&iacute;mulos para promover la incorporaci&oacute;n a la seguridad social, perder&aacute;n el beneficio y deber&aacute;n cubrir las contribuciones de Seguridad Social conforme a lo establecido en la Ley del Seguro Social y en la Ley del INFONAVIT.