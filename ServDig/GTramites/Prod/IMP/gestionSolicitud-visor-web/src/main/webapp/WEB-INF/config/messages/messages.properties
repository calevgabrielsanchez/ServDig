label.portal.informacion.usuario.nuevo=Para poder obtener los servicios del Portal usted debe registrarse previamente. Para ello, debe ingresar los datos que se solicitan a continuación, los cuales serán procesados en un breve plazo. Una vez comprobada la validez de la información, se le enviará su clave de acceso para utilizar los servicios del Portal.<br /><br />Las condiciones para registrarse implican que usted debe poseer una dirección de correo electrónico. Si aún no cuenta con dirección de correo acceda a un servidor de Internet que brinde este servicio y regístrese. Debe suministrar además, un número de teléfono válido que será utilizado para comunicarnos con usted ante cualquier dificultad.<br /><br />En el caso de menores de 18 años de edad NO SE REGISTRA la solicitud, solo el padre, la madre o un representante legal pueden efectuar trámites.
label.portal.informacion.visor.solicitudes=Puede iniciar una sesión personalizada donde podrás consultar todas las solicitudes que haz enviado, su estatus y respuestas recibidas; también puede actualizarlas o cerrarlas si ya está satisfecho con la atención que recibió.
label.portal.button.crear.cuenta.nueva=CREAR UNA CUENTA
label.portal.bienvenido=Bienvenido al Portal de Servicios del IMSS
label.portal.informacion.sistema=El IMSS es la institución de seguridad social más grande de América Latina, pilar fundamental del bienestar individual y colectivo de la sociedad mexicana y principal elemento redistribuidor de la riqueza en México; es sin duda, una de las instituciones más queridas por los MEXICANOS.<br /><br />En este espacio encontrará información detallada de todos los trámites disponibles para los distintos públicos a los que el IMSS ofrece sus servicios.<br /><br /><b>Tipos de trámites que puede realizar ante el IMSS:</b><br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;-¿Cómo realizar un trámite?<br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;-¿Qué formatos utilizar para presentar un trámite?<br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;-¿Qué tipo de documentos necesita para realizar un trámite?<br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;-Tiempos de respuesta para algún trámite<br />&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;-¿Dónde presentar un trámite, etc.?<br /><br />El IMSS se acerca a ti, en este micrositio encontrarás diversos servicios en línea que puedes consultar desde la comodidad de tu hogar, empresa o cualquier otro lugar con conexión a Internet.
